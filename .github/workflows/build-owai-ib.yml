name: Build OWAI-aligned ImageBuilder

# ⚠️ ci-filogic 是临时 scratch 分支，每次推送都触发新 run。
#   concurrency 已下沉到 build job（见 job 级 concurrency）：必须按 matrix.target 隔离，
#   否则五个并行平台抢同一个组 + cancel-in-progress → 互相 cancel，只有最后一个能跑完，
#   其余构建被中断 → 残缺 IB → 门禁误报（这正是 run20~24 多平台"系统性失败"的真凶）。
#   下沉后：新推送只 cancel 旧 run 的【同平台】job（保留原意），不误杀其他平台。

# 参考 kiddin9/Kwrt 的仓库结构，但目标不同：
#   Kwrt  = 编固件（openwrt/openwrt@openwrt-25.12 + 自家 op-packages feed，默认 APK）
#   本工作流 = 只编 **ImageBuilder**，并刻意保持 **opkg**（不与 owai 同格式就废了）
#
# 为什么不用 .config 里写 CONFIG_VERSION_REPO / CONFIG_PER_FEED_REPO：
#   在 openwrt-25.12 分支里，这些符号已从 Config-build.in / Config-images.in 消失
#   （已用 GitHub API + jsDelivr 双重实锤），写进 .config 会被 Kconfig 直接丢弃。
#   所以本流程直接在 make 文件层对齐 owai：
#     - include/version.mk   : VERSION_REPO/NUMBER/DIST 默认值改成 owai（%U 因此变 owai）
#     - include/feeds.mk     : 重写 FeedSourcesAppendOPKG —— 硬编码 owai 五分流，
#                             删掉 core 行(%U/targets/%S/packages) 与 kmods 行
#                             （owai 无 targets/ 分流，实测 404；kmod 由 IB 本地提供）
#     - target/imagebuilder/Makefile : 删掉无条件 'option check_signature'
#                             （owai 的包不是我们签的，开了会整盘拒绝安装）
#
# owai 25.12 实测存在的分流：base / luci / packages / routing / video / kiddin9
# owai 25.12 实测 404 的分流：telephony / targets(含 kmods)
#
# 架构结论：IB 必须 CONFIG_IB_STANDALONE=y（默认即 y if !BUILDBOT），自带与自身
#   内核匹配的 kmod；owai 远程只用于拉 userland 增量更新。若关闭 standalone，
#   固件将无 kmod 来源（owai 没有可用的远程 kmod）。

on:
  # 临时分支 ci-filogic 用的 push 触发器（本机无 GH token，无法调 workflow_dispatch）。
  # 仅挂 ci-filogic 一个分支，跑完即删该分支，main 保持只受 workflow_dispatch/schedule 触发。
  push:
    branches: [ci-filogic]
  workflow_dispatch:
    inputs:
      targets:
        description: '要编译的 target 列表（JSON 数组）；默认五平台（filogic/ipq807x/ipq60xx/armv8 + airoha/an7581；airoha 于 2026-11-02 新增，覆盖 Nokia XG-040G-MD 等 AN7581 PON 设备，复用 VIKINGYFY/immortalwrt@owrt 原生 airoha 目标）。只编某个就改这里'
        required: false
        default: '["mediatek/filogic","qualcommax/ipq807x","qualcommax/ipq60xx","rockchip/armv8","airoha/an7581"]'
      openwrt_branch:
        # ⚠️ 2026-11-02 起克隆源改为 VIKINGYFY/immortalwrt 的 owrt 分支（见 Clone 步 repository）。
        #    原因：wumengzhe/lede(wmz-lede-multisize) 是 coolsnowwolf/lede 衍生的 6.18 内核树，
        #    缺 kmod-ice 等驱动适配，CONFIG_ALL_KMODS=y 下必挂（run20~22 连续失败）；
        #    VIKINGYFY/immortalwrt 是 ImmortalWrt 体系、原生 6.18、S20/Keenetic/Netcraze 等移植
        #    原生存在，kmod 适配完整。
        #    owrt 分支的 mediatek/qualcommax/rockchip 三个平台 KERNEL_PATCHVER 均已为 6.18，
        #    故下方「强制 6.12→6.18」sed 对其为空操作（不会改坏）。
        description: 'VIKINGYFY/immortalwrt 分支。默认 owrt（原生 6.18，含 S20 等移植）；如需特定版本可填其他分支或配合 openwrt_ref 钉 sha'
        required: true
        # default: 'wmz-lede-multisize'   # ← 2026-11-02 弃用（coolsnowwolf/lede 衍生 6.18 缺 kmod 适配）
        default: 'owrt'
      openwrt_ref:
        # ✅ 2026-10-25 用户明确：「内核版本不一定非得控制在 6.12.108」——故取消默认钉版，
        #    改为**跟随 openwrt_branch 的分支 HEAD**（每次 CI 拉该分支最新提交）。
        #    留空 = 不钉版（默认）；填完整 40 位 sha = 钉死那一版。
        #
        #    历史上为什么钉过 7722054025462cbc4cc6225cfe49ea0ad409b302（6.12.108 代）：
        #      该代与 wmz-lede-multisize 源树内核一致，能让 assembler「镜像定义修复」改写
        #      makefile 时成为 no-op，从而消除 make info 崩溃（kernel version/hash file
        #      missing）。——但这只是**规避手段**，不是原理要求：assembler 侧真正的适配
        #      应当靠 kernel version/hash 的实际比对来做，不该靠把 CI 锁死在某一版上。
        #      锁死的代价更大：上游 openwrt-25.12 后续的 bugfix（含 subtarget 级别修复）
        #      拿不到，ipq60xx 这类新 subtarget 一旦在旧版有问题就无从解脱。
        #
        #    ⚠️ 需要复现旧构建 / 二分定位「是上游变更还是我们的改动」时，在此填那个 sha
        #      即可回到钉版状态；CI 日志首行会打印 SOURCE=<sha> 便于溯源。
        #    ⚠️ 填值必须是【完整 40 位】sha，不能用 git 缩写（12 位）！actions/checkout
        #      只把恰好 40 位十六进制当 commit sha；给 12 位它会当成【分支/标签名】去
        #      fetch refs/heads/<短sha> → 不存在 → 重试 3 次全失败，Clone 步直接挂
        #      （2026-10-16 实测）。
        description: '可选。精确 commit sha（钉版）。留空 = 跟随上面分支的 HEAD（推荐）。填值必须是完整 40 位 sha，不能用 git 缩写'
        required: false
        default: ''
      use_apk:
        description: 'true=编 APK 版 IB（默认 false；必须保持 opkg 才能与 owai 互通）'
        type: boolean
        default: false
      standalone:
        description: 'true=CONFIG_IB_STANDALONE（自带所有包，含 kmod）。false 则固件将缺 kmod，勿用'
        type: boolean
        default: true
      extra_packages:
        description: 'standalone 时额外要编进 IB 的包（空格分隔）。默认空——userland 插件应由 assembler 从 owai 远程源拉（架构本意：IB 只管 kmod+base）。⚠️ 若传 luci-app-ssr-plus/passwall/openclash 等会强拉 dnsmasq-full 的包，Generate .config 的 variant 互斥段会自动关普通 dnsmasq（见该步注释）。要更多 kiddin9 应用在此追加，例如 "luci-app-ssr-plus luci-app-passwall luci-app-openclash"'
        required: false
        default: ''
      kiddin9_feed:
        description: '挂载 kiddin9/op-packages（owai 那些包就是这个 feed 编出来的）'
        type: boolean
        default: true
      version_repo:
        description: '写进 IB 的远端仓库基址（默认就是 owai 25.12）'
        required: false
        default: 'https://dl.openwrt.ai/releases/25.12'
      version_number:
        description: 'VERSION_NUMBER（仅展示用，不影响 %U）'
        required: false
        default: '25.12-owai'
      make_release:
        description: '是否创建 GitHub Release（默认 true：构建后自动发 Release 页面）'
        type: boolean
        default: true
  schedule:
    # 每半个月自动编一次 IB（每月 1 日、15 日 00:00 UTC = 北京 08:00）。
    # 不挂 push 触发器 —— 日常提交（含本工作流文件自身改动）不会自动跑构建，避免无意义重编。
    # 需要手动触发时仍用 Actions → workflow_dispatch。
    - cron: '0 0 1,15 * *'

env:
  # ⚠️ push 触发时 inputs 为空（布尔量变成空字符串 ''）。GH 表达式里 `'' == false`
  # 会被判为 true，所以绝不能用 `== false` 做默认 true 的 fallback（会翻成 false）。
  # 正确做法：用 `== true || == ''` 识别「未设置或显式 true → true」，只有显式 false 才翻 false。
  # ⚠️ TARGET 不能放全局 env：全局 env 不支持 matrix 上下文（报 Unrecognized named-value）。
  #    改为在首个 step 用「矩阵 step 级 env」写入 $GITHUB_ENV（见 Show parameters），
  #    同时生成 TARGET_SAFE（把 / 换成 -，供 artifact 名 / Release tag 用，Git tag 禁 /）。
  # BRANCH: ${{ inputs.openwrt_branch || 'openwrt-25.12' }}   # ← 原：openwrt/openwrt 上游分支，2026-10-31 弃用
  BRANCH: ${{ inputs.openwrt_branch || 'owrt' }}   # ← VIKINGYFY/immortalwrt 的 owrt 分支（原生 6.18，含 S20 等移植）
  # ✅ 2026-10-25 起 REF 默认为空 = **不钉版**，随 BRANCH 的 HEAD 走（用户明确「内核版本
  #    不一定非得控制在 6.12.108」）。需要复现/二分时由 inputs.openwrt_ref 传完整 40 位 sha
  #    即可回到钉版。Schedule 触发时 inputs.* 全空，这里也就保持空 → 定时构建自动取最新。
  # ⚠️⚠️ 一旦填值就必须是【完整 40 位】sha，不能用 git 缩写（12 位）！actions/checkout
  #    只把恰好 40 位十六进制当 commit sha；给 12 位它会当成【分支/标签名】去 fetch
  #    refs/heads/772205402546* → 不存在 → 重试 3 次全失败，Clone 步直接挂（2026-10-16 实测）。
  REF: ${{ inputs.openwrt_ref || '' }}
  USE_APK: ${{ inputs.use_apk == true && 'true' || 'false' }}
  STANDALONE: ${{ (inputs.standalone == true || inputs.standalone == '' || inputs.standalone == null) && 'true' || 'false' }}
  EXTRA_PKGS: ${{ inputs.extra_packages || '' }}
  KIDDIN9_FEED: ${{ (inputs.kiddin9_feed == true || inputs.kiddin9_feed == '' || inputs.kiddin9_feed == null) && 'true' || 'false' }}
  VERSION_REPO: ${{ inputs.version_repo || 'https://dl.openwrt.ai/releases/25.12' }}
  VERSION_NUMBER: ${{ inputs.version_number || '25.12-owai' }}
  # ⚠️ 2026-11-02：GitHub 对 CI 匿名下载限流(403/404)系统性出现，download.pl 自带
  #   `curl -f --retry 3` 仍不够；此处追加重试 + 跨错误重试，覆盖瞬态限流。
  #   download.pl 会把 CURL_OPTIONS 追加在自带 --retry 3 之后 → 末位 --retry 生效(10)。
  CURL_OPTIONS: "--retry 10 --retry-delay 3 --retry-all-errors"

# ⚠️ 私有仓默认 GITHUB_TOKEN 只有读权限，softprops/action-gh-release 发 Release 会 403
#    （Resource not accessible by integration）。显式授予 contents:write 才能建 tag+Release。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    # ⚠️⚠️ concurrency 必须按 matrix.target 隔离（2026-11-02 run20~24 多平台系统性失败根因）：
    #   若组名不含 matrix.target，五个并行平台共享同一组 + cancel-in-progress:true → 互相 cancel，
    #   只有最后一个能跑完，其余构建被中断 → 残缺 IB（如 rockchip 仅 79 包/1 kmod）→ 门禁误报。
    #   按 target 隔离后：新推送只 cancel 旧 run 的【同平台】job（保留"避免修 bug 空跑"原意），
    #   不再误杀其他平台。job 级才能拿到 matrix 上下文（工作流级全局上下文无 matrix）。
    concurrency:
      group: ci-filogic-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    # ⚠️⚠️ 2026-10-25 实锤补：此前未设 timeout-minutes → 用 GitHub 默认 360 分钟硬上限。
    #    全 SoC filogic（~145 个 uboot+ATF 变体）实测 3h08m，四平台并行时一旦某个
    #    job 越过 6h，runner 会把它置为 **cancelled**（不是 failure）→
    #    ① 没有 tag 产出 ② `if: failure()` 的 Dump 步不触发 → 本机彻底失明，
    #    只能看到「8 小时过去、无 tag、ci-logs 未动」这种无信息量的状态（run12 现场）。
    #    设为 330（5.5h）：正常构建 3h 有余量；真超时则由 GH 判 failure → 触发 Dump
    #    诊断，/tmp/build.log 末 80 行能带回现场，可定位是卡在哪个包。
    #    ⚠️ 另注意 GitHub Free 私有仓配额 2000 分钟/月：四平台一次约 700+ 分钟，
    #    配额耗尽时 job 会**排队不启动**（同样无 tag、无日志），需到 Actions 页面确认。
    timeout-minutes: 330
    strategy:
      # 三平台并行；fail-fast:false 让单个 target 失败不拖垮其余两个
      fail-fast: false
      matrix:
        # push 触发时 inputs.targets 为空 → 回退到默认平台 JSON 数组。
        # ✅ 2026-10-25 四平台终验：filogic 修复已全通（run10 mt7981 / run11 全 SoC FIP），
        #   恢复四平台矩阵做终验。ipq60xx 于 2026-10-21 新增（与 ipq807x 同 target 不同 subtarget）。
        #   ⚠️ 非 filogic 平台：① Generate .config 的 bootloader 变体强制选中 ② Inspect 的
        #   FIP/bl2/jcg 硬门禁——均已加 filogic-only 守卫（ipq807x/ipq60xx/armv8 不产 mt798x
        #   u-boot.fip/bl2，硬门禁会误杀）。kernel.bin 门禁保持全平台（CONFIG_IB 路径为所有
        #   设备产 <device>-kernel.bin）。
        # ⚠️ 2026-10-26 IPQ-only 隔离验证已完成：run #52（98d38b9，15:05 推，2h2m2s 绿）
        #   ipq807x+ipq60xx 双双出 tag/release → qca-ssdk 哈希修复 + 下载重试验证通过。
        #   恢复四平台矩阵（filogic/ipq807x/ipq60xx/armv8）做最终终验。
        # ⚠️ 2026-11-02 新增第五平台 airoha/an7581：复用 VIKINGYFY/immortalwrt@owrt 原生
        #   airoha 目标（SUBTARGETS=en7523/an7581/an7583，KERNEL_PATCHVER=6.18），覆盖
        #   Nokia XG-040G-MD 等 AN7581 PON 设备。airoha 走非 filogic 路径：bootloader 变体
        #   强制段与 FIP/bl2 硬门禁均 filogic-only 守卫 → 自动跳过；内核镜像门禁后缀并集含
        #   airoha 的 -uImage.itb。kmod 选择块无需 airoha 专属分支（airoha DEFAULT_PACKAGES
        #   已含 kmod-usb3/kmod-usb-dwc3；PON 闭源 airoha-xpon.ko 走 wmz-test-pon 线，不经此 IB）。
        target: ${{ fromJson(inputs.targets || '["mediatek/filogic","qualcommax/ipq807x","qualcommax/ipq60xx","rockchip/armv8","airoha/an7581"]') }}
    steps:
      - name: Show parameters
        env:
          # 矩阵 step 级 env 支持 matrix 上下文（全局 env 不支持）
          MT: ${{ matrix.target }}
        run: |
          # 写入 $GITHUB_ENV，供后续步骤的 $TARGET 与 artifact/tag 用的 $TARGET_SAFE 使用
          echo "TARGET=$MT" >> "$GITHUB_ENV"
          echo "TARGET_SAFE=${MT//\//-}" >> "$GITHUB_ENV"
          echo "target        = $MT"
          echo "branch        = $BRANCH  ref=${REF:-<head>}"
          # ⚠️ 钉版自检（2026-10-25 修正）：用户明确「内核版本不一定非得控制在 6.12.108」，
          #    故 **空 REF 现在合法**——回退到 openwrt_branch 的 HEAD（随上游最新）。
          #    schedule 定时构建 / workflow_dispatch 不填 openwrt_ref / push 触发器（inputs 全空）
          #    三种情况下 REF 都为空，此前此处 `exit 1` 会让**每一次**这类触发在第一步秒挂
          #    （run14/run15 的「页面马上报错、监控却失明」根因就在这）。
          #    空 REF 的代差风险由后续「Self-check IB (make info must not crash)」步兜底
          #    （IB 内核代与源树脱代会 make info 非零退出并带诊断），无需在此 preemptive 失败。
          #    仍保留【长度+字符集】校验：只有「非空且非 40 位 sha」才 fatal——这种值会让
          #    actions/checkout 把它当分支名去 fetch refs/heads/<短sha> 而失败，必须在 Clone 前拦下。
          #    （别用 case + 40 个字符类的写法，实测会把合法 40 位 sha 误判为非法。用 bash
          #      正则 ^[0-9a-fA-F]{40}$ 最稳。）
          if [[ "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "openwrt_ref = 完整 40 位 sha ✓"
          elif [ -z "$REF" ]; then
            echo "::warning::openwrt_ref 为空 —— 回退到 openwrt_branch 头($BRANCH)，IB 内核代随上游漂移；若与源树脱代，后续 make info 自检会拦下"
          else
            echo "::error::openwrt_ref=$REF 不是完整 40 位 sha（长度 ${#REF}）。actions/checkout 会把它当分支/标签名去 fetch refs/heads/$REF 而失败。请补全为 40 位。"
            exit 1
          fi
          echo "use_apk       = $USE_APK   (false=opkg，与 owai 同格式)"
          echo "standalone    = $STANDALONE (true 才带 kmod)"
          echo "kiddin9 feed  = $KIDDIN9_FEED"
          echo "version_repo  = $VERSION_REPO"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget zstd
          sudo apt-get clean

      - name: Clone openwrt source
        uses: actions/checkout@v4
        with:
          # repository: openwrt/openwrt   # ← 原：官方上游仓，2026-10-31 弃用（不含我们的设备移植）
          # repository: wumengzhe/lede      # ← 2026-11-02 弃用：coolsnowwolf/lede 衍生的 6.18 内核树缺 kmod-ice 等驱动适配，ALL_KMODS 下必挂
          repository: VIKINGYFY/immortalwrt   # ← 现：V佬 immortalwrt fork 的 owrt 分支（原生 6.18，S20 等移植原生存在，kmod 适配完整）
          # REF 为空 → 取 BRANCH 的 HEAD（不钉版，默认行为）；REF 有值 → 钉那个 sha。
          # 下一步会打印 SOURCE=<完整 sha>，即使是随 HEAD 走的构建也能精确溯源。
          ref: ${{ env.REF || env.BRANCH }}
          fetch-depth: 1
          path: openwrt

      - name: Prepare feeds.conf
        working-directory: openwrt
        run: |
          git log -1 --format='SOURCE=%H %cd'
          # owai 没有 telephony 分流（实测 404），留着会在 feeds 解析时浪费时间
          sed -i "/telephony/d" feeds.conf.default
          if [ "$KIDDIN9_FEED" = "true" ]; then
            sed -i '$a src-git kiddin9 https://github.com/kiddin9/op-packages.git;main' feeds.conf.default
          fi
          echo "--- feeds.conf.default ---"
          cat feeds.conf.default

      # ------------------------------------------------------------------
      # 关键：在 make 文件层对齐 owai，绕开 openwrt-25.12 已不稳定的 Kconfig 符号
      # ------------------------------------------------------------------
      - name: Patch makefiles to align with OWAI (opkg repo layout)
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          import re, os, sys
          REPO = os.environ["VERSION_REPO"]
          VNUM = os.environ["VERSION_NUMBER"]

          # 1) include/version.mk —— %U / %V / %D 的默认值改成 owai（不依赖 Kconfig 符号）
          p = "include/version.mk"
          s = open(p).read()
          s = re.sub(r"VERSION_NUMBER:=\$\(if \$\(VERSION_NUMBER\),\$\(VERSION_NUMBER\),[^)]*\)",
                     "VERSION_NUMBER:=%s" % VNUM, s)
          s = re.sub(r"VERSION_DIST:=\$\(if \$\(VERSION_DIST\),\$\(VERSION_DIST\),[^)]*\)",
                     "VERSION_DIST:=OpenWrt", s)
          s = re.sub(r"VERSION_REPO:=\$\(if \$\(VERSION_REPO\),\$\(VERSION_REPO\),[^)]*\)",
                     "VERSION_REPO:=%s" % REPO, s)
          open(p, "w").write(s)
          print("[version.mk] VERSION_REPO ->", REPO)

          # 2) include/feeds.mk —— 重写 FeedSourcesAppendOPKG
          #
          #    ⚠️⚠️ 这里改的是【固件的 /etc/opkg/distfeeds.conf】，不是 IB 的 repositories.conf
          #    （后者由 target/imagebuilder/Makefile 按 CONFIG_IB_STANDALONE 自动生成）。
          #    distfeeds.conf 是刷进设备后的**真下载源** —— firmware-assembler 的品牌残留审计
          #    把它列为"② 刻意不动：动了会废掉装包"。所以**任何情况下都不能让它为空**。
          #
          #    ⚠️⚠️ 曾踩的坑（run 38677412301 三平台全挂 1h36m）：本补丁原先在
          #    STANDALONE=true 时把 define 写成**空**，而 package/base-files/Makefile
          #    install 段是无条件三段拼接：
          #      mkdir -p $(1)/etc/opkg; \
          #      $(call FeedSourcesAppendOPKG); \
          #      $(VERSION_SED_SCRIPT) $(1)/etc/opkg/distfeeds.conf
          #    OpenWrt 把反斜杠续行拼成【单行】交给 bash -c，空 define 留下 `; ;`
          #    → `bash: -c: line 1: syntax error near unexpected token ';'` (Error 2)
          #    → base-files 编译失败 → package/compile Error 2 → 整个 job 挂。
          #    （注：用 ";" 占位同样炸，会变成 "; ;; "。唯一空命令占位是 ":"。）
          #
          #    现在 STANDALONE / 非 STANDALONE **都写 owai 五分流**，因为二者要的东西不同：
          #      · IB 的 repositories.conf = 纯本地自含（IB_STANDALONE 管的）→ assembler
          #        的 OWAI_REMOTE_INJECT=auto 判定为"自含"→ 不注入第二份远程源 → 无混源代差。
          #      · 固件的 distfeeds.conf    = owai 远程源（这里管的）→ 刷出来的机器能装包。
          #    两个源各司其职，不再互相打架。
          p = "include/feeds.mk"
          s = open(p).read()
          new = (
              "define FeedSourcesAppendOPKG\n"
              "( \\\n"
              "  echo 'src/gz %d_base %U/packages/%A/base'; \\\n"
              "  echo 'src/gz %d_luci %U/packages/%A/luci'; \\\n"
              "  echo 'src/gz %d_packages %U/packages/%A/packages'; \\\n"
              "  echo 'src/gz %d_routing %U/packages/%A/routing'; \\\n"
              "  echo 'src/gz %d_video %U/packages/%A/video'; \\\n"
              "  echo 'src/gz %d_kiddin9 %U/packages/%A/kiddin9'; \\\n"
              ") >> $(1)\n"
              "endef\n"
          )
          tag = "（owai 五分流，去 core/kmods；STANDALONE 与否同此，因固件必须有下载源）"
          s, n = re.subn(r"define FeedSourcesAppendOPKG\n.*?\nendef\n", new, s, count=1, flags=re.S)
          if n == 0:
              print("[feeds.mk] !! 未匹配到 FeedSourcesAppendOPKG，请检查 openwrt 源码"); sys.exit(1)
          open(p, "w").write(s)
          print("[feeds.mk] FeedSourcesAppendOPKG 已重写" + tag)

          # 3) target/imagebuilder/Makefile —— 删掉无条件 'option check_signature'
          p = "target/imagebuilder/Makefile"
          s = open(p).read()
          s2, n = re.subn(r"\n[ \t]*echo 'option check_signature'.*\n", "\n", s)
          if n == 0:
              print("[imagebuilder/Makefile] 警告：未找到 option check_signature 行（可能已改）")
          else:
              open(p, "w").write(s2)
              print("[imagebuilder/Makefile] 已删除 option check_signature (n=%d)" % n)

          # 4) target/imagebuilder/Makefile —— STANDALONE 补拷 bin/targets 下的 target 专属包
          #    2026-10-21 build (3).log 实锤：官方 STANDALONE 分支只
          #    `$(FIND) $(wildcard $(PACKAGE_SUBDIRS)) ... cp`，而 base-files/libc/kernel/
          #    uci/netifd/firewall4/dnsmasq-full 等 target 专属包全部打在
          #    bin/targets/<t>/<s>/packages/（CI 日志实锤 base-files 打包进该目录），
          #    不在 PACKAGE_SUBDIRS → 没进 IB → 组装 opkg "Unknown package" 全线崩
          #    （firewall4 缺 iptables 依赖、kmod-shortcut-fe 缺失级联）。
          #    Kwrt IB 1418 包全自带（他们自建打包流程），owai 远程源无这些核心包
          #    （六分流实测 kernel/kmod/libc/base-files=0，firewall4/iptables 也没有）
          #    → IB 本地必须出，补拷是唯一正解。
          p = "target/imagebuilder/Makefile"
          s = open(p).read()
          # ⚠️ 2026-10-31：克隆源改为 wumengzhe/lede（LEDE master 代）后，
          #    其 imagebuilder/Makefile 的 STANDALONE 分支写的是字面量 '-name *.ipk'，
          #    且外层多包一层 ifeq(CONFIG_BUILDBOT) → endif 缩进为 "  endif"，
          #    旧的上游 25.12 锚点（PACKAGE_SUFFIX + 顶层 endif）不匹配 → run54 四平台
          #    在本步 1 分钟内全挂。现改为「插入式」补丁：只锚 FIND 两行、在其后追加
          #    bin/targets 补拷行，不吞 endif（对缩进/非缩进 endif 都安全）。
          #    两个锚点按序尝试：LEDE(*.ipk) 优先，上游 25.12(PACKAGE_SUFFIX) 兜底。
          inject_lines = (
              "\t# wmz 补丁 2026-10-31: PACKAGE_SUBDIRS 不含 bin/targets/<t>/<s>/packages,\n"
              "\t# 而 target 专属包(base-files/libc/kernel/firewall4/uci/netifd/dnsmasq-full...)\n"
              "\t# 全打在那里; STANDALONE 必须一并拷入, 否则 IB 缺核心用户态链(组装 opkg Unknown)。\n"
              "\t$(FIND) $(TOPDIR)/bin/targets -type f -name '*.ipk' \\\n"
              "\t\t-exec $(CP) -t $(PKG_BUILD_DIR)/packages/ {} +\n"
          )
          anchor_lede = ("\t$(FIND) $(wildcard $(PACKAGE_SUBDIRS)) -type f -name '*.ipk' \\\n"
                         "\t\t-exec $(CP) -t $(PKG_BUILD_DIR)/packages/ {} +\n")
          anchor_up = ("\t$(FIND) $(wildcard $(PACKAGE_SUBDIRS)) -type f -name '*.$(PACKAGE_SUFFIX)' \\\n"
                       "\t\t-exec $(CP) -t $(PKG_BUILD_DIR)/packages/ {} +\n")
          if "wmz 补丁 2026-10-31: PACKAGE_SUBDIRS" in s:
              print("[imagebuilder/Makefile] bin/targets 补拷已存在，跳过（幂等）")
          elif anchor_lede in s:
              s = s.replace(anchor_lede, anchor_lede + inject_lines, 1)
              open(p, "w").write(s)
              print("[imagebuilder/Makefile] STANDALONE 补拷 bin/targets 已注入（LEDE *.ipk 锚点）")
          elif anchor_up in s:
              s = s.replace(anchor_up, anchor_up + inject_lines, 1)
              open(p, "w").write(s)
              print("[imagebuilder/Makefile] STANDALONE 补拷 bin/targets 已注入（上游 PACKAGE_SUFFIX 锚点）")
          else:
              print("[imagebuilder/Makefile] !! 未匹配 STANDALONE FIND 锚点（LEDE 与上游形态均未命中），请检查 openwrt 源码"); sys.exit(1)

          # 5) target/imagebuilder/Makefile —— STANDALONE 下也必须强制拷 base-files/libc/kernel
          #
          #    ⚠️⚠️ 2026-10-22 实锤（run 39593223394 产出的 IB，sha256 校验通过仍缺 11 项核心包）：
          #      官方 L71-77 只在【非】STANDALONE 分支强制拷这三个包；STANDALONE 分支
          #      只靠 $(wildcard $(PACKAGE_SUBDIRS))。而这三个包在裸 defconfig 下
          #      **不会被选中**（它们经 DEFAULT_PACKAGES 进镜像，不走 Kconfig 符号）
          #      → 不编译 → 不进 bin/packages/<arch>/… → IB 里彻底没有。
          #      firmware-assembler 的核心链校验实测缺：base-files / kernel /
          #      dnsmasq-full / firewall4 / luci-base / luci-compat /
          #      luci-lib-nixio / dropbear / rpcd-mod-luci / libustream-mbedtls。
          #      kmod 1113 个齐全（来自 bin/packages 各 feed 目录），纯用户态链断裂。
          #    → 这里把官方的强制拷逻辑复制一份，**无条件**执行（STANDALONE 与否都跑），
          #      保证这三个包只要被编译过就一定进 IB。
          #
          #    ⚠️⚠️ 附带的重大发现（同次实锤）：那份缺失清单里的 iptables-zz-legacy 是
          #      **幽灵项**——它不存在于 openwrt-25.12 + kiddin9 这套环境：
          #        · openwrt core package/network/utils/iptables 无任何变体（就叫 iptables）
          #        · kiddin9/op-packages 895 个顶层包里无 iptables/zz 相关
          #        · owai 六个分流索引 grep 均 0 命中
          #      它是纯 Provides 元包（Provides: iptables, iptableslegacy；
          #      Depends: libc, xtables-legacy），只出现在 **Kwrt 的 IB** 里
          #      （assembler build.sh v7.42 的拆包实锤：data.tar.gz 仅 95 字节、只含 ./）。
          #      → assembler 的校验表已把它移除（18→17 项），否则自建 IB 永远无法通过
          #        校验、update 永远拒绝切换。本工作流三处包列表同样不再含它。
          p = "target/imagebuilder/Makefile"
          s = open(p).read()
          anchor2 = "endif\n\nifneq ($(CONFIG_SIGNATURE_CHECK),)"
          # ⚠️⚠️⚠️ 注入块的每一行【必须以 TAB 开头】——2026-10-22 run 39741239372 实锤教训：
          #   我第一版把官方那几行的「续行」写成了空格缩进（视觉抄的），make 直接
          #   `Makefile:91: *** missing separator. Stop.` → target/imagebuilder/compile
          #   Error 1 → 四平台里 filogic 整盘失败（跑了一小时才看到）。
          #   官方原文（cat -A 实测，L72-77）每一行都是 ^I 开头：
          #     ^I$(FIND) $(call FeedPackageDir,libc) -type f \
          #     ^I  \( \
          #     ^I^I-name 'base-files...' -or \
          #     ...
          #     ^I  -exec $(CP) -t $(PKG_BUILD_DIR)/packages {} +
          #   这些行属同一个 recipe 的续行，TAB 是 make 的 recipe 标识，换成空格即语法错误。
          #   → 下面所有行一律 "\t" 开头，并在注入后逐行自校验（见 _assert_tabs）。
          force_lines = [
              "\t# wmz 补丁 2026-10-31: 无条件强制拷入 base-files/libc/kernel。",
              "\t# 官方只在非 STANDALONE 分支做此事；STANDALONE 分支这三个包若未被",
              "\t# .config 选中就不会编译，IB 直接缺失 → assembler opkg Unknown package。",
              "\t# 2026-10-31：改用字面量 *_*.ipk 模式 —— LEDE master 不定义",
              "\t# PACKAGE_VERSION_SEPARATOR/PACKAGE_SUFFIX，字面量对 opkg 恒成立。",
              "\t$(FIND) $(call FeedPackageDir,libc) -type f \\",
              "\t  \\( \\",
              "\t\t-name 'base-files_*.ipk' -or \\",
              "\t\t-name 'libc_*.ipk' -or \\",
              "\t\t-name 'kernel_*.ipk' \\) \\",
              "\t  -exec $(CP) -t $(PKG_BUILD_DIR)/packages {} +",
          ]
          def _assert_tabs(lines, tag):
              """make 的 recipe 续行必须全以 TAB 开头；空格缩进会 missing separator。"""
              for ln in lines:
                  body = ln.rstrip("\n")
                  if not body or body.lstrip().startswith("#"):
                      continue
                  if not body.startswith("\t"):
                      print("[imagebuilder/Makefile] !! %s 行未以 TAB 开头: %r" % (tag, body[:60]))
                      sys.exit(1)
          _assert_tabs(force_lines, "强制拷补丁")
          force = "endif\n\n" + "\n".join(force_lines) + "\n\nifneq ($(CONFIG_SIGNATURE_CHECK),)"
          if anchor2 in s and "wmz 补丁 2026-10-31: 无条件强制拷入" not in s:
              s = s.replace(anchor2, force, 1)
              open(p, "w").write(s)
              # 落盘后再全校验一遍：确保注入区每行都合规（防手改回归）
              _chk = [l for l in open(p).read().splitlines()
                      if "FeedPackageDir,libc" in l or "base-files_*.ipk" in l]
              _bad = [l for l in _chk if l.strip() and not l.startswith("\t")]
              if _bad:
                  print("[imagebuilder/Makefile] !! 注入后校验失败，未以 TAB 开头 %d 行" % len(_bad)); sys.exit(1)
              print("[imagebuilder/Makefile] 无条件强制拷 base-files/libc/kernel 已注入（TAB 校验通过）")
          elif "wmz 补丁 2026-10-31: 无条件强制拷入" in s:
              print("[imagebuilder/Makefile] 强制拷补丁已存在，跳过")
          else:
              print("[imagebuilder/Makefile] !! 未匹配 SIGNATURE_CHECK 锚点"); sys.exit(1)
          PY

      # ⚠️⚠️ libffi InstallDev fficonfig.h 路径修复（2026-11-03 实锤，run 41476171687 /
      #   41504460309 filogic 连续失败；run29=36338cb 因正则错配源码变量名而 Patch 步自身
      #   sys.exit(1) 导致 job 在构建前 abort —— 修复从未真正生效）：
      #   真实 Makefile（VIKINGYFY/immortalwrt@owrt package/libs/libffi/Makefile）InstallDev 是：
      #     $(CP) \
      #         $(PKG_BUILD_DIR)/$(GNU_TARGET_NAME)*/fficonfig.h \
      #         $(1)/usr/include/
      #   $(GNU_TARGET_NAME) 是 Make 变量（构建时才展开成 aarch64-openwrt-linux），源码里没有字面
      #   aarch64-openwrt-linux* —— 之前正则硬编码字面串故匹配失败。libffi 3.8.0 out-of-tree 构建把
      #   fficonfig.h（configure 生成的私有头）放到 <build_dir>/<target>/ 下某处，原 glob 落空 →
      #   cp: cannot stat → .libffi_installed Error 1 → 整盘编译失败（libffi 是 base 库，5 平台都要编）。
      #   ✅ 改为 find 定位 fficonfig.h（任何布局通用），找不到则优雅跳过（2>/dev/null || true）。
      #   幂等：已替换过（源码不再含 $(GNU_TARGET_NAME)*/fficonfig.h 硬编码块）→ 跳过。
      - name: Inject supergateway_s20 eMMC sysupgrade.itb (web-failsafe direct-flash FIT)
        # S20 系列 eMMC + yuzhi U-Boot：原生只产 sysupgrade.tar，web failsafe/后台直刷 tar 会 brick。
        # 把 sysupgrade.bin 从 tar 直接改成自包含 FIT itb（文件名仍叫 .bin：assembler 的 build.sh
        # 取像只认 *.bin、不认 .itb，见 3577-3583；FIT 魔数 0xd00dfeed 与扩展名无关，web-failsafe/LuCI 都照常识别）。
        # 对齐 asus_rt-ax59u-ubi / tplink_wma301-common 的 eMMC itb 模板。
        # 内联 heredoc（owai-ib-builder 仓本身未被 checkout 到磁盘，不能依赖 $GITHUB_WORKSPACE/scripts/）。
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          import sys, os
          TAB = chr(9)
          NL = chr(10)
          p = "target/linux/mediatek/image/filogic.mk"
          if not os.path.isfile(p):
              print("[inject] !! 找不到 %s (CWD=%s)，请确认 working-directory" % (p, os.getcwd()))
              sys.exit(1)
          s = open(p, encoding="utf-8").read()
          if (TAB + "IMAGE/sysupgrade.bin := append-kernel") in s:
              print("[inject] 已含 s20 eMMC itb(sysupgrade.bin 内容) 注入，跳过（幂等）")
              sys.exit(0)
          block_anchor = "define Device/supergateway_s20-common"
          img_anchor = "IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata"
          bi = s.find(block_anchor)
          if bi == -1:
              print("[inject] !! 未找到 supergateway_s20-common，请检查 VIKINGYFY 源")
              sys.exit(1)
          ji = s.find(img_anchor, bi)
          if ji == -1:
              print("[inject] !! s20-common 内未找到 sysupgrade.bin(tar) 锚点")
              sys.exit(1)
          # 关键: supergateway 的 DEVICE_DTS 在 sub-device(s20l/m/p) 的 $(call ...-common)
          # 之后才赋值, 故 IMAGE recipe 里的 $(KDIR)/$(DEVICE_DTS) 必须用双 $(延迟到 recipe
          # 执行期展开), 否则 define 解析期就展开成空 → image-.dtb (初版单 $ 的 brick 根因)。
          # 对齐 asus_rt-ax59u-ubi / tplink_wma301-common 的 eMMC itb 模板。
          # 文件名仍用 sysupgrade.bin: assembler 的 build.sh 取像只认 *.bin(3577-3583), 不认 .itb;
          # FIT 魔数 0xd00dfeed 与扩展名无关, web-failsafe/LuCI 都照常识别。
          inject = (
              TAB + "IMAGES := sysupgrade.bin" + NL
              + TAB + "KERNEL := kernel-bin | lzma" + NL
              + TAB + "IMAGE/sysupgrade.bin := append-kernel | fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb external-with-rootfs | append-metadata" + NL
          )
          s = s[:ji] + inject + s[ji + len(img_anchor):]
          open(p, "w", encoding="utf-8").write(s)
          assert (TAB + "IMAGE/sysupgrade.bin := append-kernel") in s, "s20 itb 注入校验失败"
          print("[inject] supergateway_s20 注入 eMMC sysupgrade.itb(落为 sysupgrade.bin) 成功")
          PY

      - name: Patch libffi InstallDev fficonfig.h path (out-of-tree build fix)
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          import re, sys
          p = "package/libs/libffi/Makefile"
          try:
              s = open(p).read()
          except FileNotFoundError:
              print("[libffi/Makefile] 文件不存在，跳过（非此目标可忽略）"); sys.exit(0)
          # 匹配真实 3 行 $(CP) 块：源码里是 $(GNU_TARGET_NAME) 变量，非字面 aarch64-openwrt-linux
          pat = re.compile(
              r"\t\$\(CP\) \\\n"
              r"\t\t\$\(PKG_BUILD_DIR\)/\$\(GNU_TARGET_NAME\)\*/fficonfig\.h \\\n"
              r"\t\t\$\(1\)/usr/include/\n"
          )
          repl = (
              "\t# [owai-patch] libffi 3.8.0 out-of-tree：fficonfig.h 位置随版本漂移，用 find 兜底\n"
              "\tfind $(PKG_BUILD_DIR) -name fficonfig.h -exec $(CP) {} $(1)/usr/include/ \\; 2>/dev/null || true\n"
          )
          s2, n = pat.subn(repl, s, count=1)
          if n == 0:
              if "fficonfig.h" in s:
                  print("[libffi/Makefile] !! 含 fficonfig.h 但未匹配 $(GNU_TARGET_NAME)* 硬编码块，请检查"); sys.exit(1)
              else:
                  print("[libffi/Makefile] 未含 fficonfig.h 硬编码（可能已修），跳过"); sys.exit(0)
          open(p, "w").write(s2)
          print("[libffi/Makefile] InstallDev fficonfig.h 改为 find 定位 (n=%d)" % n)
          PY

      # ⚠️ qca-ssdk（Qualcomm SSDK 交换芯片驱动，仅 TARGET_qualcommax/ipq 选中）的
      #   PKG_MIRROR_HASH 在 GitHub Actions runner 的 git 2.55.0 下与 `git archive` 实际产出
      #   不符：qca-ssdk 仓库带触发归档差异的 .gitattributes，git 新版本归档方式变了 →
      #   下载期 "Hash mismatch" 整盘失败（ipq807x/ipq60xx 必编，filogic/armv8 不受影响）。
      #   旧修法（钉死某次 got 哈希值）对 wumengzhe/lede 有效，但切到 VIKINGYFY 后其 qca-ssdk
      #   源码/commit 不同 → 钉死值必定失配 → 反而制造新的 Hash mismatch。
      #   ✅ 改用 OpenWrt 原生的 `PKG_MIRROR_HASH:=skip`（include/download.mk 的 wrap_mirror
      #     明确支持：`[ "$(MIRROR_HASH)" = "skip" ]` 即跳过哈希校验）。对任意源树 / runner git
      #     版本都免疫哈希漂移，且 qca-ssdk 当前不在 qualcommax 的 DEFAULT_PACKAGES（仅设备
      #     profile 选中，而本流程不显式选设备 profile → 大概率不拉取，skip 更无副作用）。
      - name: Patch qca-ssdk PKG_MIRROR_HASH -> skip (git-2.55.0 .gitattributes workaround)
        working-directory: openwrt
        run: |
          F=package/kernel/qca-ssdk/Makefile
          if [ -f "$F" ]; then
            sed -i "s#^PKG_MIRROR_HASH:=.*#PKG_MIRROR_HASH:=skip#" "$F"
            echo "qca-ssdk PKG_MIRROR_HASH -> $(grep '^PKG_MIRROR_HASH' "$F")"
          else
            echo "qca-ssdk Makefile 不存在（非 qualcommax 目标可忽略）"
          fi

      - name: Exclude openwrt_one device (IB build quirk)
        # openwrt_one 的组合固件 artifact（nor/snand-preloader.bin 等）依赖 phony 目标
        # `openwrt_one-images`，该目标只在【完整 image 构建上下文】定义、IB 构建期不定义 →
        # `make target/linux/install` 崩在 "No rule to make target 'openwrt_one-images'"
        # （run3 实锤 ci-logs run=39890290506，停在 target/linux/install Error 2）。
        # openwrt_one 是开发板、不发货，从 filogic 的 TARGET_DEVICES 剔除即可绕开，
        # 不影响任何真要发货的设备（jcg_q30-pro 等）的 kernel.bin 预置。
        working-directory: openwrt
        run: |
          F=target/linux/mediatek/image/filogic.mk
          if [ -f "$F" ] && grep -q 'TARGET_DEVICES += openwrt_one' "$F"; then
            sed -i '/TARGET_DEVICES += openwrt_one/d' "$F"
            echo "openwrt_one 已从 filogic TARGET_DEVICES 剔除（绕开 openwrt_one-images 坑）"
          else
            echo "openwrt_one 不在 filogic 设备列表或文件不存在，跳过（仅 filogic 有此设备）"
          fi

      - name: Force kernel 6.18 (fix mac80211/nat46 netns_local on filogic/ipq)
        # run16/run17 实锤：fork wmz-lede-multisize 的 mediatek/qualcommax 默认
        # KERNEL_PATCHVER:=6.12，但 package/kernel/mac80211/Makefile:13-14 对 6.12 与
        # 6.18 都吃 backports 6.18.39，而 6.18.39 引用 6.13+ 才有的
        # struct net_device.netns_local → 6.12 下 mac80211(WiFi) 与 nat46 整段编不过
        # （netns_local 缺失：nat46-netdev.c:124 / mac80211 core.c:168,176,192,200,1556）。
        # 用户 2026-10-31 决策：全平台切 6.18。rockchip/armv8 本就 6.18（sed 幂等）。
        # 注意：此 sed 必须在 defconfig 之前（Generate .config 步之前），否则 KERNEL_PATCHVER
        # 不生效。本步位于 feeds/defconfig 之前，满足。
        # ⚠️ 2026-11-02：克隆源切到 VIKINGYFY/immortalwrt@owrt 后，三个平台 KERNEL_PATCHVER
        #   本就已是 6.18，此 sed 匹配 6.12 失败→纯空操作（无害，保留以防回切 wumengzhe/lede）。
        working-directory: openwrt
        run: |
          for f in target/linux/mediatek/Makefile target/linux/qualcommax/Makefile target/linux/rockchip/Makefile; do
            if [ -f "$f" ]; then
              sed -i 's/^KERNEL_PATCHVER:=6.12/KERNEL_PATCHVER:=6.18/' "$f"
              echo "$f -> $(grep -E '^KERNEL_PATCHVER' "$f")"
            else
              echo "$f 不存在，跳过"
            fi
          done

      - name: Drop orphaned cmcc_rax3000me u-boot variants (undefined board_init)
        # run17 实锤：package/boot/uboot-mediatek/Makefile 列了 3 个 mt7981_cmcc_rax3000me
        # 变体（emmc/nand-ddr3/nand-ddr4，define 块 + build 列表三行），但 filogic.mk 无
        # 对应设备档案（orphaned）→ 编译 u-boot-2025.10/common/board_r.c:678
        # undefined reference to 'board_init'。这 3 个变体是半吊子移植，直接删掉。
        working-directory: openwrt
        run: |
          F=package/boot/uboot-mediatek/Makefile
          if [ -f "$F" ]; then
            sed -i \
              -e '/define U-Boot\/mt7981_cmcc_rax3000me-emmc/,/^endef/d' \
              -e '/define U-Boot\/mt7981_cmcc_rax3000me-nand-ddr3/,/^endef/d' \
              -e '/define U-Boot\/mt7981_cmcc_rax3000me-nand-ddr4/,/^endef/d' \
              -e '/mt7981_cmcc_rax3000me-emmc \\$/d' \
              -e '/mt7981_cmcc_rax3000me-nand-ddr3 \\$/d' \
              -e '/mt7981_cmcc_rax3000me-nand-ddr4 \\$/d' \
              "$F"
            echo "cmcc_rax3000me 变体剩余定义数: $(grep -c 'mt7981_cmcc_rax3000me' "$F")"
          else
            echo "uboot-mediatek Makefile 不存在，跳过"
          fi

      # run21 触发：wmz-lede-multisize 已推 95740ee6（删 supergateway-s20-common.dtsi 多余的 /dts-v1/;，修 run20 filogic S20 dtb 全挂）。
      # 本提交本身不改构建逻辑，仅重跑 CI 从 95740ee6 重建四平台 IB（含 S20）。
      - name: Enable 6.18 kconfig for ntfs3 (ALL_KMODS 雪崩修复)
        # run18 实锤：切到 6.18 后 CONFIG_ALL_KMODS=y 拉来的 kmod 在 6.18 下雪崩：
        #  - 旧 NTFS_FS 在 6.18 已彻底移除 → kmod-fs-ntfs 物理无 ntfs.ko → 打包失败
        #    （改用 NTFS3_FS=m，由 kmod-fs-ntfs3 提供 NTFS 读支持；源树 config-6.18
        #     已由 ed38566d3 设为 CONFIG_NTFS3_FS=m，此处 sed 作为兜底幂等重设）
        #  - RPCSEC_GSS_KRB5 6.18 依赖链脆弱，已在源树 fs.mk 由 ed38566d3 把
        #    kmod-fs-nfs-common-rpcsec 在 6.18 上 DEPENDS+=@!LINUX_6_18 排除，
        #    **不再强制注入**内核 config（否则内核构建本身会去编脆弱模块→整棵 IB 挂）。
        working-directory: openwrt
        run: |
          C=target/linux/generic/config-6.18
          if [ -f "$C" ]; then
            sed -i 's/# CONFIG_NTFS3_FS is not set/CONFIG_NTFS3_FS=m/' "$C"
            echo "NTFS3=$(grep -E '^CONFIG_NTFS3_FS' "$C")"
          else
            echo "$C 不存在，跳过"
          fi

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          # 6.18 不兼容的 feed kmod：rkp-ipid / quectel_MHI / libpfring 在 6.18 内核 API 下编译失败
          # （rkp-ipid.c 'VERSION' undeclared / mhi_netdev_quectel.c hrtimer_init 隐式声明 /
          #  pf_ring.o 6.18 API 错误）。在 install 之前删除其源码目录，使其不被选中，
          #  避免 CONFIG_ALL_KMODS=y 把它们拉进来雪崩。
          for d in $(find feeds -type d \( -name rkp-ipid -o -name quectel_MHI -o -name libpfring \)); do
            echo "rm feed: $d"; rm -rf "$d"
          done
          # 注意：刻意不用 Kwrt 的 `install -a -p kiddin9 -f` ——
          # op-packages 根目录带 luci-base/luci-mod-*/luci-nginx 等 core 组件，
          # 一把梭会把整棵 LuCI 换掉。这里只做普通全装。
          ./scripts/feeds install -a
          # ⚠️⚠️ shortcut-fe 必须删（2026-10-21 两度实证，SFE 与 6.12 深度不兼容）：
          #   第一次（942d46c 之前的 c67b916）删包，理由是 fast_forwarded 编不过——正确但不完整。
          #   第二次（942d46c）改成打补丁保留只删 fast_forwarded，结果 run 39579273036
          #   **四平台全灭**（filogic/ipq807x/ipq60xx/armv8 同因），sfe_cm.c 还有 5 处 netfilter
          #   API 变迁（6.12 权威定义实锤）：
          #     511  'struct nf_tcp_net' has no member 'tcp_no_window_check'（6.12 已去掉该成员）
          #     804  'struct nf_ct_event_notifier' has no member 'fcn'（6.12 改名 ct_event 并加了 exp_event）
          #     804  callback 类型不兼容（fcn→ct_event 连带）
          #     1107 void value not ignored（nf_conntrack_register_notifier 6.x 返回 void）
          #     1195 too many arguments（nf_conntrack_unregister_notifier 6.x 只收 net）
          #   即 Qualcomm SFE 源码停在 ~5.4，6.12 上需逐个适配 5+ 处且修完可能还有——
          #   每轮 CI 2~4 小时，迭代成本不可接受（ALL_KMODS 会把本包扫进所有平台编译）。
          #   决策：删包保 IB 完整；assembler 侧已把 kmod-shortcut-fe 从 filogic 平台必备
          #   降为「可选」（platform_packages.json optional_by_target），前端卡片仍可见。
          #   需要 filogic 硬件 HWNAT 加速时：单独立项适配 SFE 到 6.12，或改用 Kwrt IB。
          #   注意 uninstall 只删 package/ 下的 symlink，feeds/ 源目录要单独 rm。
          rm -rf package/kiddin9/shortcut-fe feeds/kiddin9/shortcut-fe
          if [ -e package/kiddin9/shortcut-fe ] || [ -L package/kiddin9/shortcut-fe ] || [ -e feeds/kiddin9/shortcut-fe ]; then
            echo "!! shortcut-fe 仍存在，删除失败"; exit 1
          fi
          echo "shortcut-fe 已删除 OK（SFE 与 6.12 深度不兼容，详见上方注释）"

      - name: Generate .config
        working-directory: openwrt
        run: |
          BOARD="${TARGET%%/*}"
          SUBTARGET="${TARGET##*/}"
          {
            echo "CONFIG_TARGET_${BOARD}=y"
            echo "CONFIG_TARGET_${BOARD}_${SUBTARGET}=y"
            # ⚠️ CONFIG_IB 必须显式置 y：IB_STANDALONE depends on IB，
            #    而 config IB 的默认值是 BUILDBOT（CI 上未设→n），不写 IB=y
            #    会让 defconfig 因依赖不满足而静默丢弃 IB_STANDALONE。
            echo "CONFIG_IB=y"
            # ⚠️⚠️ 不再强制 CONFIG_ALL_KMODS（2026-11-02 重构，对齐 CloseWRT-CI 方法论）：
            #   旧逻辑：dl.openwrt.ai 四个 feed 实测 kmod-*=0（kiddin9 编译前删纯 KernelPackage），
            #   kmod 只能由 IB 本地出 → 故强制 ALL_KMODS=y 让 IB 含全部 ~985 个 kmod。
            #   但 ALL_KMODS 在 6.18 下雪崩：kmod-ice(Intel E810)/kmod-nat46/kmod-fs-ntfs 等
            #   消费路由用不到的树外模块编不过 → 整盘失败（run20~23 连续实锤，联发科之外的 3
            #   平台全挂在它）。
            #   新逻辑（参考 wumengzhe/CloseWRT-CI：浅克隆 VIKINGYFY + 标准 feeds + 精选配置，
            #   全程不编 ALL_KMODS 照样出可用固件）：IB 只编【平台默认 kmod 集】——而 assembler
            #   真正需要的 SoC 固件(mt798x/ath11k)、ipt/nft/usb 等恰恰都在 filogic/qualcommax/
            #   rockchip 的 DEFAULT_PACKAGES 与 assembler 注入清单里；owai 远程只补 userspace。
            #   奇葩 kmod(ice/nat46/旧 ntfs)本就不进默认集 → 自然不编 → 雪崩消失。代价：assembler
            #   若请求某非默认 kmod 会走 §4 静默剔包（同旧行为），但对我们的路由设备无影响。
            #   ✅ 顺带撤销旧的三个 =N 排除（kmod-nat46/kmod-fs-ntfs/kmod-ice）——它们仅用于压制
            #   ALL_KMODS 雪崩，关掉 ALL_KMODS 后失去意义；kmod-fs-ntfs3 由下方 ntfs3 配置补丁
            #   以 NTFS3_FS=m 提供 NTFS 读支持。
            # （不再写入 CONFIG_ALL_KMODS；保持默认 n → IB 仅含默认 kmod 集）
            echo "# CONFIG_ALL_KMODS is not set"
            # ⚠️⚠️ KERNEL_WERROR 必须关（2026-10-20 run 39371381477 实锤）：
            #   ALL_KMODS 会把 kiddin9 feed 里的 vendored 内核包也扫进来编译，例如
            #   quectel_MHI（pcie_mhi-1.3.8）在 6.12.108 上：
            #     mhi_init.c:2700:6: error: no previous prototype for 'mhi_cntrl_exit'
            #     cc1: all warnings being treated as errors
            #   → ERROR: package/feeds/kiddin9/quectel_MHI failed to build → 整盘失败。
            #   mediatek/filogic target 默认 KERNEL_WERROR=y，把 -Wmissing-prototypes
            #   升级成致命错误。Kwrt devices/common/.config L29 实锤 CONFIG_KERNEL_WERROR=n，
            #   他们的 IB 同样全量编 feed 内核包，靠关 WERROR 容忍 vendored 驱动的警告。
            #   ⚠️ 不能靠删包规避：owai 有用户态包 Depends kmod-pcie_mhi
            #   （kiddin9 feed "Depends: libc, kmod-pcie_mhi, pciutils, quectel-cm"），
            #   删了 IB 里就没这个 kmod，那个插件在 assembler 侧装不上。
            #   关 WERROR 只放过"警告"，真正的编译错误仍会 fail——不会掩盖问题。
            echo "CONFIG_KERNEL_WERROR=n"
            # PER_FEED_REPO：与 owai 的分流布局（base/luci/packages/routing/video/kiddin9）
            # 对齐，Kwrt 亦为 y。影响 bin/packages 的子目录组织。
            echo "CONFIG_PER_FEED_REPO=y"
            echo "CONFIG_SIGNED_PACKAGES=n"
            echo "CONFIG_SIGNATURE_CHECK=n"
            if [ "$USE_APK" = "true" ]; then
              echo "CONFIG_USE_APK=y"
            else
              echo "# CONFIG_USE_APK is not set"
            fi
            if [ "$STANDALONE" = "true" ]; then
              echo "CONFIG_IB_STANDALONE=y"
              for p in $EXTRA_PKGS; do echo "CONFIG_PACKAGE_${p}=y"; done
            else
              echo "# CONFIG_IB_STANDALONE is not set"
            fi
            # ⚠️⚠️ 核心用户态链必须显式选中（2026-10-22 实锤，run 39593223394 的 IB 缺 11 项）：
            #   这批包在裸 defconfig 下【不会被选中】——它们经 DEFAULT_PACKAGES 进镜像，
            #   不走 Kconfig 符号；而 IB 目标不构建镜像 → 不编译 → 不进 bin/packages
            #   → IB 缺失 → firmware-assembler 组装时报 opkg "Unknown package" 全线崩。
            #   owai 远程源也救不了：六分流实测 kernel/kmod/libc/base-files=0，
            #   firewall4/iptables/dnsmasq-full/luci-base/dropbear 同样为 0。
            #   名单与 assembler 的 17 项校验（vm_ib.sh verify_ib）逐字对齐。
            for p in base-files libc kernel uci netifd dnsmasq-full firewall4 \
                     nftables-json luci-base luci-compat luci-lib-nixio \
                     ppp-mod-pppoe dropbear odhcp6c rpcd-mod-luci libustream-mbedtls; do
              echo "CONFIG_PACKAGE_${p}=y"
            done
            # ⚠️⚠️ owai 远程源**不含 core 仓库的包**（2026-10-23 实测：kiddin9 / packages /
            #   base / luci 四个流 grep curl|iptables|iptables-nft|ip6tables-nft|libxtables12|
            #   libip4tc2 全部 0 命中）——owai 只发 feed 包（packages/luci/routing/video/
            #   kiddin9），core 仓库（package/network/... 那一层）一个都没有。
            #   而 kiddin9 的包在索引里明确依赖它们（实锤）：
            #     · firewall4                  Depends: ..., iptables, ip6tables, ...
            #     · firewall(v3)               Depends: libip4tc2 libip6tc2 libiptext0
            #                                           libiptext6-0 libxtables12
            #                                           iptables-legacy ip6tables-legacy ...
            #     · iptables-mod-fullconenat   Depends: iptables, kmod-ipt-fullconenat
            #     · luci-app-passwall2         Depends: curl, ...
            #   → 只能由 IB 本地出，否则 opkg "Unknown package" → assembler §4 静默剔除；
            #     firewall4 装不上时 assembler 的重试会把 firewall4 整删（刷出来没防火墙）。
            #   ⚠️ iptables / ip6tables 是 Provides 虚名：
            #     iptables-nft（PROVIDES:=iptables，DEFAULT_VARIANT）
            #     iptables-zz-legacy（PROVIDES:=iptables iptables-legacy）
            #     两个都编，才能同时满足「要 iptables」和「要 iptables-legacy」两种依赖。
            #     库同理：libip4tc(ABI2→libip4tc2)、libiptext(ABI0→libiptext0)。
            # ⚠️ 这里用 **=m**（只出 ipk、不装进 staging rootfs），不是 =y：
            #   package/install 阶段会把所有 =y 的包 opkg 装进 $(TARGET_DIR)，
            #   两个 iptables 变体同时 =y 就有可能像当初 dnsmasq variant 那样
            #   在 package/Makefile:100 打架（数据文件冲突 → Error 255 → 整盘挂）。
            #   我们要的只是 ipk 进 IB（bin/packages），=m 正好：编出来但不装。
            # 两个变体都编，是因 owai 索引实锤 12+34+1 处 Depends 引用虚名 iptables、
            # 7 处引用 ip6tables、1 处引用 iptables-legacy，而**没有任何一处**引用
            # 实名 iptables-nft / ip6tables-nft —— 故 zz-legacy（同时 PROVIDES
            # iptables-legacy）覆盖面最大，nft 变体留着兜底实名依赖。
            for p in curl \
                     iptables-nft ip6tables-nft iptables-zz-legacy ip6tables-zz-legacy \
                     xtables-nft xtables-legacy libxtables libip4tc libip6tc \
                     libiptext libiptext6 libiptext-nft \
                     iptables-mod-conntrack-extra iptables-mod-iprange \
                     iptables-mod-socket iptables-mod-tproxy ip6tables-mod-nat; do
              echo "CONFIG_PACKAGE_${p}=m"
            done
            # ⚠️⚠️ 显式选中 assembler 需要的全部 kmod（2026-11-02 配套「关闭 ALL_KMODS」）：
            #   关掉 ALL_KMODS 后 IB 只含默认 kmod 集，但各平台 DEFAULT_PACKAGES 极薄
            #   （mediatek 仅 leds-gpio/gpio-button-hotplug；qualcommax/rockchip 也不含 ipt/nft），
            #   而 assembler 注入的 WiFi 栈/ipt/nft/usb 必须进 IB 本地（owai 远程 kmod=0，见 build_lib.py:2212）。
            #   故此处逐包显式 =y，等价于 CloseWRT-CI 在 Config/GENERAL.txt 列 kmod 的做法；
            #   在不适用的目标上选中不存在/依赖未满足的符号 → defconfig 静默忽略，零风险。
            # --- MediaTek filogic WiFi 栈（mediatek DEFAULT_PACKAGES 仅 leds-gpio/gpio-button-hotplug，
            #   必显式选；且仅限 mediatek）。⚠️ VIKINGYFY/immortalwrt 用**开源 mt76 栈**
            #   （package/kernel/mt76）：filogic 集成 WiFi 的【驱动】是 kmod-mt7915e（mt7981/7986/7988
            #   集成 WiFi 统一走 mt7915e 驱动，与 GL-MT6000/jcg_q30-pro 的 DEVICE_PACKAGES 一致），
            #   【基带固件】是 kmod-mt7981/7986/7988-firmware，【offload 固件】是 mt798x-wo-firmware
            #   （均在 package/firmware/linux-firmware/mediatek.mk + mt76 Makefile 定义，已实锤存在）。
            #   **不是** wumengzhe/lede 的闭源 mt_wifi/conninfra/mediatek_hnat（VIKINGYFY 搜索 0 命中）。
            #   assembler 侧早已对齐 mt76：build.sh:4289-4372 校验 kmod-mt7915e/mt76-core/mt76-connac/
            #   mac80211/cfg80211，platform_packages.json:29 注入 kmod-mt7915e → IB 本地必须含这些包
            #   （owai 远程 kmod=0，见 build_lib.py:2212）。故此处选 mt76 驱动 + 基带固件 + WO 固件；
            #   闭源包名一律不写（写了也被 defconfig 静默忽略）。
            if [ "$BOARD" = "mediatek" ]; then
              for p in kmod-mt76 kmod-mt7915e kmod-mt7981-firmware kmod-mt7986-firmware \
                       mt7981-wo-firmware mt7986-wo-firmware \
                       kmod-mt7988-firmware mt7988-wo-firmware \
                       kmod-mt7622-firmware; do
                echo "CONFIG_PACKAGE_${p}=y"
              done
            fi
            # --- Qualcomm ath11k WiFi（qualcommax 默认已含，仅 qualcommax 补选兜底）---
            if [ "$BOARD" = "qualcommax" ]; then
              for p in kmod-ath11k kmod-ath11k-ahb kmod-ath11k-pci; do
                echo "CONFIG_PACKAGE_${p}=y"
              done
            fi
            # --- iptables / nftables 内核模块（assembler 注入，无任何平台默认含；跨平台通用）---
            for p in kmod-ipt-conntrack kmod-ipt-core kmod-ipt-extra kmod-ipt-filter \
                     kmod-ipt-ipopt kmod-ipt-iprange kmod-ipt-nat kmod-ipt-nat-extra \
                     kmod-ipt-nat6 kmod-ipt-offload kmod-ipt-raw kmod-ipt-tproxy \
                     kmod-ipt-compat-xtables \
                     kmod-nft-core kmod-nft-nat kmod-nft-offload kmod-nft-tproxy \
                     kmod-nft-fullcone kmod-nft-bridge \
                     kmod-ipset kmod-ipt-ipset kmod-ebtables kmod-nf-nat6 kmod-nf-flow; do
              echo "CONFIG_PACKAGE_${p}=y"
            done
            # --- USB 内核模块（filogic 默认不含；qualcommax/rockchip 部分默认含，补选兜底）---
            for p in kmod-usb-core kmod-usb2 kmod-usb3 kmod-usb-ohci kmod-usb-ehci \
                     kmod-usb-xhci-hcd kmod-usb-dwc3 kmod-usb-dwc3-qcom \
                     kmod-usb-storage kmod-usb-storage-uas kmod-usb-storage-extras \
                     kmod-usb-net kmod-usb-net-rndis kmod-usb-net-cdc-ether \
                     kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan \
                     kmod-usb-serial-qualcomm; do
              echo "CONFIG_PACKAGE_${p}=y"
            done
            # --- assembler 杂项 kmod（turboacc/zram/fan/passwall 依赖，跨平台通用）---
            #   关掉 ALL_KMODS 后 IB 只含默认 kmod 集，下列 kmod 不在任何平台 DEFAULT_PACKAGES：
            #     · kmod-tun          ← passwall/openvpn/wireguard 等隧道（2026-11-05 构建日志实锤缺）
            #     · kmod-tcp-bbr      ← luci-app-turboacc（BBR 拥塞控制，实锤缺）
            #     · kmod-sched-bbr    ← luci-app-turboacc（BBR 调度器，与 tcp-bbr 配套）
            #     · kmod-zram         ← zram-swap（实锤缺）
            #     · kmod-lib-zstd     ← zram zstd 压缩 / 通用（实锤缺）
            #     · kmod-hwmon-pwmfan ← luci-app-fan（实锤缺）
            #   均为 6.18 in-tree 标准模块，不含 kmod-ice/nat46/旧 ntfs 等雪崩驱动，安全。
            #   不适用目标上选中不存在/依赖未满足的符号 → defconfig 静默忽略，零风险（见 L796）。
            for p in kmod-tun kmod-tcp-bbr kmod-sched-bbr kmod-zram \
                     kmod-lib-zstd kmod-hwmon-pwmfan; do
              echo "CONFIG_PACKAGE_${p}=y"
            done
            # --- 【数据驱动】owai 远程源依赖的全部 kmod（根治「缺了好多 kmod」）---
            #   关掉 ALL_KMODS 后 IB 只含默认 kmod 集，而 owai 四 feed 有 128+ 用户态包
            #   Depends kmod-*，远不止上方手列 6 个 → 依赖它们的插件被 assembler §4 静默剔除。
            #   故此处直接吃 owai【冻结 25.12】真实索引（与 assembler 装包同源，dl.openwrt.ai/
            #   releases/25.12），抽出所有 kmod-* 依赖全 =y 编进 IB 本地池：既全覆盖，又不会
            #   触发 ALL_KMODS 雪崩（ice/nat46/旧ntfs 在 owai 依赖图里无引用 → 不被拉入）。
            #   ⚠️ 必须用 $VERSION_REPO（=dl.openwrt.ai/releases/25.12）而非本地 feeds：本地
            #      kiddin9 来自 GitHub main（随源漂），与 assembler 实际安装的冻结 25.12 可能脱代。
            #   ⚠️ kmod 包名与 arch 无关（kmod-tun/kmod-usb-core 等跨 aarch64 同名），对
            #      aarch64_cortex-a53 / aarch64_generic 取并集即覆盖全部 5 平台。
            #   ⚠️ 跳过 6.18 已知编不过的雪崩驱动（feeds 已删的 rkp-ipid/quectel_MHI/libpfring/
            #      shortcut-fe 不必列；此处防 ice/nat46/旧ntfs 被误拉进编译）。
            #   ⚠️ 网络/解析失败时仅告警：上方手列清单 + 默认集作兜底，构建仍出固件。
            _skip=" kmod-ice kmod-nat46 kmod-fs-ntfs "
            _owai_kmods=""
            for _ax in aarch64_cortex-a53 aarch64_generic; do
              for _fd in kiddin9 packages base luci; do
                _gz="/tmp/owai_${_ax}_${_fd}.gz"
                curl -sSL -m 120 -o "$_gz" \
                  "${VERSION_REPO}/packages/${_ax}/${_fd}/Packages.gz" 2>/dev/null || continue
                _mg=$(head -c2 "$_gz" | od -An -tx1 | tr -d ' \n')
                [ "$_mg" = "1f8b" ] || continue
                _kk=$(zcat "$_gz" 2>/dev/null | grep -E '^Depends:' \
                       | grep -oE 'kmod-[a-z0-9][a-z0-9_-]*' | LC_ALL=C sort -u)
                _owai_kmods="$_owai_kmods $_kk"
              done
            done
            _n=0
            for p in $(echo "$_owai_kmods" | tr ' ' '\n' | LC_ALL=C sort -u); do
              [ -z "$p" ] && continue
              case " $_skip " in *" $p "*) continue ;; esac
              echo "CONFIG_PACKAGE_${p}=y"
              _n=$((_n+1))
            done
            echo "owai 依赖 kmod 数据驱动注入: ${_n} 种（已跳过 6.18 雪崩驱动）"
            # --- 用户态库 libatomic1（2026-11-05 实锤缺：luci-app-passwall → haproxy → libatomic1）---
            #   25.12 base 链的 toolchain 产出 libatomic1；IB 默认不编它 → passwall 装不上
            #   （日志: satisfy_dependencies_for luci-app-passwall: libatomic1）。IB 自带即与自身
            #   libc 同代同源，满足 haproxy 依赖。不存在则 defconfig 静默忽略（零风险）。
            echo "CONFIG_PACKAGE_libatomic1=y"
            # --- 用户态 passwall C 依赖（按 IB libc 重建，根治 libatomic1 / 其它 libc 失配）---
            #   haproxy 是 libatomic1 的唯一直属来源(build (1).log 388/1168 实锤: haproxy -> libatomic1)。
            #   这些包若从 owai 冻结版(25.12 旧 libc/toolchain)拉, 与 IB 的 VIKINGYFY HEAD libc 漂开
            #   -> 依赖(opkg 报 libatomic1 找不到)或符号失配。把它们编进 IB 本地池(同 toolchain/libc),
            #   opkg 优先用 IB 本地版(IB 源在 repositories.conf 排 owai 之前) -> 彻底消除失配。
            #   均为 packages 标准 C 小工具; 不存在/不适用目标的符号被 defconfig 静默忽略(零风险)。
            #   ⚠️ 版本优先级陷阱: 若 owai 冻结版同名包版本号高于 IB 版, opkg 会选 owai 那份(又失配);
            #      由 firmware-assembler 的 excise 守卫(检测到 IB 自带则抠掉 owai 同名项)兜底, 见 build.sh。
            for p in haproxy v2ray-plugin dns2tcp ipt2socks microsocks \
                     chinadns-ng dns2socks trojan-plus simple-obfs \
                     kcptun-client shadowsocks-libev redsocks; do
              echo "CONFIG_PACKAGE_${p}=y"
            done
            # ⚠️ 不再关闭 rootfs（撤销 fd6c47c 的关 rootfs 块）：
            #   原关 rootfs 仅为让独立的 `make target/linux/install` 退化成只产 kernel.bin；
            #   现在已撤掉该独立步（见 Build 步），关 rootfs 反而会让 IB 运行期 make image
            #   没有可用根文件系统格式 → 组装必崩。改回 run1 写法：保留默认 rootfs
            #   （squashfs 等），只跑 target/imagebuilder/compile 打 IB 包，不编全套固件镜像。
          } >> .config
          # ⚠️⚠️ filogic bootloader 全量显式选中（2026-10-24 新增，build (6).log 实锤）：
          #   IB 运行期用 Build/mt7981-bl31-uboot / Build/mt7981-bl2 拼
          #   bl31-uboot.fip 与 preloader.bin 时，要 cat 两份 staged 件：
          #     staging_dir/.../image/mt7981_<dev>-u-boot.fip   ← uboot-mediatek 设备变体
          #     staging_dir/.../image/<tfa-variant>-bl2.img     ← arm-trusted-firmware-mediatek 设备变体
          #   这两类变体在 u-boot.mk / trusted-firmware-a.mk 里 HIDDEN:=1 且 DEFAULT 只在
          #   「设备 profile 被选中」时成立（u-boot.mk:100-104：DEFAULT:=y if
          #   (TARGET_DEP_Default || TARGET_DEP_DEVICE_<dev>)）。我们只选了 subtarget，
          #   没选任何设备 profile → 全部 bootloader 变体都没编 → STAGING_DIR_IMAGE 空 →
          #   拷贝进 IB 后运行期 `cat .../mt7981_jcg_q30-pro-u-boot.fip` 报 No such file →
          #   make[3] Error 1（build (6).log line 1821-1825 实锤）。
          #   修法：直接把 filogic 的全部 uboot / TFA 设备变体强制 =y（hidden 包强制选合法；
          #   uboot 变体的 DEPENDS:=+trusted-firmware-a-<x> 会连带拉入对应 TFA 变体），
          #   覆盖每个设备的 FIP 与 preloader 来源。
          #   ⚠️ 不靠选设备 profile（CONFIG_TARGET_DEVICE_*=y）：那样会经 DEVICE_PACKAGES
          #   额外拉一批包、还可能搅动 dnsmasq/iptables 的精细互斥处理；本步只补 bootloader。
          #   kernel.bin 已由 Build 步的 target/linux/install 覆盖（run6 已验证），此处不动。
          _owai_pick_bl() {
            # ⚠️⚠️ 2026-10-24 run9 实锤：这里有两个独立的坑，先后都踩过：
            #   坑1(符号名)：uboot 变体真实包名 = u-boot-<variant>（include/u-boot.mk:91
            #     `define Package/u-boot-$(1)`）；曾误写 uboot-mediatek-<variant>（全树零命中）。
            #     TFA 前缀 trusted-firmware-a- 经 DEPENDS:=+trusted-firmware-a-... 实证正确。
            #   坑2(时机)：`conf --defconfig=.config`(toplevel.mk:124) 会把「非默认选中的
            #     HIDDEN 包 =y」静默丢弃——run9 在 defconfig 前追加 66 行只剩 4（jcg uboot
            #     丢失 → 缺 FIP → 卡门禁；幸存的 tfa 是被默认设备 uboot 的 DEPENDS 拉着）。
            #   ⇒ 本函数改为【直接改写 .config】：sed 删该符号既有行（# 注释/已设值，防重复条目）
            #     + 追加 =y；且调用点必须放在本步所有 make defconfig 之后（见下方 dnsmasq 块之后）。
            #     构建读 .config 原样采用（toplevel.mk:94 对含 CONFIG_HAVE_DOT_CONFIG 的 .config
            #     是 no-op，不重跑 conf）；即便触发 oldconfig 也会保留显式 =y（只 defconfig 丢）。
            #   ⚠️ 2026-10-24 run11：全 SoC 覆盖（用户决策"最终目标=全 SoC 通用 IB"，对标 openwrt.ai）。
            #     run10 已用 mt7981 家族验证 post-defconfig 机制通过，故去掉 SoC 过滤，选全部
            #     filogic 变体（uboot 全 4 SoC + TFA 全显式——post-defconfig 不重跑 config，
            #     DEPENDS 的 select 不解析，必须显式选 TFA）。openwrt.ai 的 IB 即全 SoC(80 FIP)。
            #     构建预估 ~4h（6h 上限内）；run9 已实证 65 个 TFA 全编过。
            local mk="$1" prefix="$2" v sym
            for v in $(awk '
              /^define (U-Boot|Trusted-Firmware-A)\// { n=$2; sub(/^[^/]+\//,"",n); f=0; next }
              /BUILD_SUBTARGET:=filogic/ { if (n!="") f=1; next }
              /^endef/ { if (n!="" && f==1) print n; n=""; next }
            ' "$mk"); do
              sym="${prefix}${v}"
              sed -i "/^CONFIG_PACKAGE_${sym}=/d;/^# CONFIG_PACKAGE_${sym} is not set/d" .config
              echo "CONFIG_PACKAGE_${sym}=y" >> .config
            done
          }
          # ⚠️⚠️ bootloader 变体选中改到下方 dnsmasq 块之后、所有 make defconfig 之后再执行
          #   （run9 实锤：defconfig 前追加会被 conf --defconfig 丢弃，66 行只剩 4，jcg FIP 缺失）。
          make defconfig
          # ⚠️⚠️ post-defconfig：dnsmasq variant 互斥（2026-10-20 run 39413072738 实锤）：
          #   dnsmasq 包有三个 variant（package/network/services/dnsmasq/Makefile）：
          #     dnsmasq（nodhcpv6，DEFAULT_VARIANT）/ dnsmasq-dhcpv6 / dnsmasq-full
          #   三者都 PROVIDES:=dnsmasq 且装同一批文件（/etc/init.d/dnsmasq、
          #   /usr/sbin/dnsmasq、/etc/dnsmasq.conf 等 10 个）。
          #   EXTRA_PKGS 带 luci-app-ssr-plus（kiddin9 feed LUCI_DEPENDS L33 实锤
          #   含 +dnsmasq-full；passwall/openclash 同理）→ dnsmasq-full=y；
          #   而 filogic 默认配置链同时有 dnsmasq=y → package/install 阶段 opkg 报：
          #     check_data_file_clashes: dnsmasq-full wants to install .../etc/init.d/dnsmasq
          #     But that file is already provided by package * dnsmasq
          #     opkg_install_cmd: Cannot install package dnsmasq-full / luci-app-ssr-plus
          #     make[1]: *** [package/Makefile:100: package/install] Error 255 → 整盘失败。
          #   （该 run 编译 2h49m 全过——kmod 编译层已全绿——纯倒在 install 配置问题。）
          #   修法：full 是超集（DNSSEC/DHCPv6/ipset/nftset 全开）且 PROVIDES dnsmasq，
          #   opkg 依赖层无感 → 关普通 variant 保 full，与官方 menuconfig 选 full 的行为一致。
          #   仅在 full 被选时才关（EXTRA_PKGS 为空时默认配置只有普通 dnsmasq，不能动）。
          if grep -q "^CONFIG_PACKAGE_dnsmasq-full=y" .config; then
            echo "# CONFIG_PACKAGE_dnsmasq is not set" >> .config
            echo "# CONFIG_PACKAGE_dnsmasq-dhcpv6 is not set" >> .config
            make defconfig
            if grep -q "^CONFIG_PACKAGE_dnsmasq=y" .config; then
              echo "::error::dnsmasq 被其他包强选无法关闭——EXTRA_PKGS 与默认配置 variant 冲突，请从 extra_packages 移除会强拉 dnsmasq-full 的包"; exit 1
            fi
            echo "dnsmasq variant 互斥已处理：full=y，普通/dhcpv6 已关"
          fi
          # ⚠️⚠️ filogic bootloader 变体强制选中（必须在本步所有 make defconfig 之后！）：
          #   IB 运行期 Build/mt7981-bl31-uboot 要 cat staging_dir/.../image/mt7981_<dev>-u-boot.fip、
          #   bl2 要 <tfa>-bl2.img；这些 HIDDEN 变体只在「设备 profile 选中」时 DEFAULT=y，我们只选
          #   subtarget → 不编 → 缺 FIP（build (6).log 实锤 cat No such file）。
          #   _owai_pick_bl 直接改写 .config（sed 删旧行 + 追加 =y），绕过 defconfig 的丢弃；
          #   全 SoC 覆盖（mt7981/7986/7987/7988）全部 filogic 设备的 FIP/preloader，对标 openwrt.ai。
          #   ⚠️ 仅 filogic：非 filogic target 不产 mt798x bootloader，选中会往 .config 塞孤儿 =y。
          if [ "$TARGET" = "mediatek/filogic" ]; then
            _owai_pick_bl package/boot/uboot-mediatek/Makefile u-boot-
            _owai_pick_bl package/boot/arm-trusted-firmware-mediatek/Makefile trusted-firmware-a-
            echo "--- bootloader =y（defconfig 之后强制选中）存活校验 ---"
            echo "全 SoC(mt798x) uboot/tfa =y 行数（预期 ~140+）: $(grep -cE '^CONFIG_PACKAGE_(u-boot|trusted-firmware-a)-mt798' .config)"
            grep -qE '^CONFIG_PACKAGE_u-boot-mt7981_jcg_q30-pro=y' .config && echo "  ✓ jcg uboot =y 在 .config" || echo "  ✗✗ jcg uboot =y 缺失（强制选中失败）"
            grep -qE '^CONFIG_PACKAGE_trusted-firmware-a-mt7981-spim-nand-ddr3=y' .config && echo "  ✓ jcg tfa =y 在 .config" || echo "  ✗✗ jcg tfa =y 缺失"
          else
            echo "非 filogic target($TARGET)：跳过 bootloader 变体强制选中（FIP/bl2 仅 filogic 需要）"
          fi
          echo "--- 生效的关键配置 ---"
          grep -E '^(CONFIG_USE_APK|CONFIG_IB|CONFIG_IB_STANDALONE|CONFIG_SIGNATURE_CHECK|CONFIG_ALL_KMODS|CONFIG_KERNEL_WERROR|CONFIG_TARGET_|CONFIG_PACKAGE_dnsmasq)' .config | head -20
          # ⚠️ 若上面看不到 CONFIG_IB=y 与 CONFIG_IB_STANDALONE=y，说明 defconfig 把它们丢了（依赖不满足），STANDALONE 会失效
          # ⚠️⚠️ 核心用户态链选中情况（2026-10-22 实锤：裸 defconfig 下
          #   base-files/kernel/firewall4/dropbear/luci-base 等一个都不选 → IB 缺 11 项）。
          #
          #   ⚠️⚠️ 这里只**告警**、不 fail（2026-10-22 二次修正）：defconfig 会静默丢弃
          #     「Kconfig 符号不存在」的项，而 18 项里并非全都有符号 —— 实锤
          #     `package/kernel/Makefile` 在该钉版 commit 上 **404**，即不存在
          #     `CONFIG_PACKAGE_kernel` 这个符号，写进 .config 也会被丢弃。
          #     其余项也可能因 target/feed 差异而不存在（如 iptables-zz-legacy 这类
          #     kiddin9 专名）。若在此 fail，会把本可成功的构建整体卡死。
          #     → 权威判定交给后面的「Inspect produced IB」tarball 逐包断言（那个查的是
          #       真实 .ipk 文件，不依赖符号是否存在），这里只提供早期可见性。
          echo "--- 核心用户态链选中情况（符号不存在的项会被 defconfig 丢弃，仅告警）---"
          for p in base-files libc kernel uci netifd dnsmasq-full firewall4 \
                   nftables-json luci-base luci-compat luci-lib-nixio \
                   ppp-mod-pppoe dropbear odhcp6c rpcd-mod-luci libustream-mbedtls; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  ✓ $p"
            else
              echo "  · $p 未被选中（符号不存在或该 target 不支持）——由 tarball 断言最终判定"
            fi
          done
          echo "注：base-files/libc/kernel 三者由 imagebuilder/Makefile 的无条件强制拷保证进 IB，"
          echo "    不依赖此处是否选中；其余项由 Inspect produced IB 逐包断言兜底。"

      - name: Pre-seed dl/ from OpenWRT/ImmortalWRT source mirrors (绕开外部下载限流导致的损坏 tarball)
        working-directory: openwrt
        run: |
          # ⚠️ 2026-11-03：run25/26/27 连续因外部下载被限流，包源码下到损坏/HTML 文件 →
          #   configure 污染 → host 工具(libffi/libtool)编译失败（"no Makefile" / "1q: command not found"）。
          #   OpenWrt download.pl 默认 GitHub 优先；限流下先挂、镜像兜底也不稳。
          #   根治：构建前把树内所有【字面 PKG_SOURCE】从 OpenWRT/ImmortalWRT 源镜像预下载进 dl/。
          #   download.pl 见 dl/ 已有同名且哈希吻合的文件会跳过下载 → 彻底绕开外部限流。
          #   （动态 PKG_SOURCE 如 $(PKG_NAME)-$(PKG_VERSION).tar.gz 无法静态预取，仍交 download.pl，
          #    由 CURL_OPTIONS --retry-all-errors 重试兜底。）
          mkdir -p dl
          mapfile -t SRCS < <(grep -rhoE 'PKG_SOURCE[[:space:]]*:[[:space:]]*=[[:space:]]*[^[:space:]]+' --include=Makefile . 2>/dev/null \
                              | sed -E 's/^PKG_SOURCE[[:space:]]*:[[:space:]]*=[[:space:]]*//' | sort -u)
          TOTAL=${#SRCS[@]}
          OK=0
          echo "树内字面 PKG_SOURCE 数: $TOTAL（将从源镜像预下载进 dl/）"
          for f in "${SRCS[@]}"; do
            got=""
            for m in \
              "https://downloads.openwrt.org/sources/$f" \
              "https://sources.openwrt.org/$f" \
              "https://downloads.immortalwrt.org/sources/$f"; do
              if curl -fL --retry 5 --retry-delay 2 --connect-timeout 10 "$m" -o "dl/$f" 2>/dev/null && [ -s "dl/$f" ]; then
                got="$m"; break
              else
                rm -f "dl/$f"
              fi
            done
            [ -n "$got" ] && OK=$((OK+1)) || echo "· 镜像无 $f（留 download.pl 走 GitHub）"
          done
          echo "源镜像预下载成功: $OK / $TOTAL"

      - name: Download sources
        working-directory: openwrt
        run: |
          # ⚠️ 2026-10-26：源下载易因 openwrt/feed 镜像瞬态抖动失败(wget 8 / 连接重置)，
          #   裸跑无重试则整步红、job 失败（即 CI 侧「下载报错」根因）。加重试：最多 3 次，
          #   间隔 15s。用户「查看下载报错原因，然后单独跑下」据此加固。
          for i in 1 2 3; do
            if make -j$(nproc) download V=s; then
              echo "download OK (第 $i 次尝试)"; break
            fi
            echo "::warning::make download 第 $i 次失败，15s 后重试..."; sleep 15
          done

      # ------------------------------------------------------------------
      # ⚠️ 构建顺序（OpenWrt 标准 phase 顺序，**必须显式逐级**，否则 top-level
      #    `make package/install` 会跳过编译、且宿主 opkg 未构建 → 127 失败）：
      #    tools → toolchain → target/compile(kernel) → package/compile
      #    (含宿主 opkg 的 HOST_BUILD) → package/install(填充 bin/packages)
      #    → target/linux/install(产 <device>-kernel.bin)
      #    → target/imagebuilder/compile。绝不单独调 package/install / IB 编译。
      #    注：25.12 已无 tools/opkg，宿主 opkg 来自 package/system/opkg host 构建。
      #
      #    ⚠️⚠️ target/linux/install 是 2026-10-23 补的（build (4).log 实锤）：
      #      用自建 IB 组装时 make image 末段崩在
      #        make[3]: *** No rule to make target
      #        '.../build_dir/target-<arch>_musl/linux-<t>_<s>/<device>-kernel.bin'
      #      根因：include/image.mk 的 Device/Build/kernel 只在【非 IB 且 CONFIG_IB=y】时
      #      把 $(KDIR_KERNEL_IMAGE) 挂在 **install** 目标上；而 target/compile 到不了
      #      （PROFILE 未设 → _PROFILE_SET 空 → _COMPILE_TARGET=compile-disabled，
      #       且 install 才有 kernel_prepare 的 vmlinux 落盘）。
      #      IB 打包靠 `-cp $(KERNEL_BUILD_DIR)/* $(IB_KDIR)/` 把这些文件带进 IB，
      #      没跑 install 就是一个都没有 → 任何机型组装都在最后一步崩。
      # ------------------------------------------------------------------
      - name: Build toolchain, kernel, all packages, then ImageBuilder
        working-directory: openwrt
        run: |
          # ⚠️ 单条 make 串整套 phase：tools→toolchain→target/compile(kernel)→package/compile
          #    →package/install(填充 bin/packages)→target/linux/install(产 <device>-kernel.bin)
          #    →target/imagebuilder/compile(打 IB 包)。这是 run1 风格的单条 make；但 run1/run4
          #    漏了 **target/linux/install** 这一环 → IB 内 0 个 kernel.bin → 下游 jcg_q30-pro
          #    拼 .itb 崩（build (5).log 实锤：No rule to make target '.../jcg_q30-pro-kernel.bin'）。
          #    ⚠️⚠️ 为什么必须含 target/linux/install（run4 漏它 → 0 kernel.bin）：
          #    include/image.mk 的 Device/Build/kernel 在 `ifndef IB` + `ifdef CONFIG_IB` 下把每个
          #    设备的 $(KDIR_KERNEL_IMAGE)（即 <device>-kernel.bin）挂到 `install` 目标（image.mk:755）；
          #    target/imagebuilder/Makefile:112 再用 `-cp $(KERNEL_BUILD_DIR)/* $(IB_KDIR)/` 把这些
          #    kernel.bin 打进 IB。
          #    ↑ 这条链**只在构建 IB 时（IB 未置）**生效；IB 运行期 IB=1 会把整段 `ifndef IB`
          #    （image.mk:753）屏蔽，运行期根本没有现编内核的规则——kernel.bin 必须构建期预置，
          #    否则任何 .itb 设备组装必崩。早先（fd6c47c→a68cf5a）撤掉该步是**错误方向**。
          #    ⚠️ openwrt_one 坑（run3 实锤 ci-logs run=39890290506）：openwrt_one 的组合固件
          #    artifact 依赖 phony `openwrt_one-images`（只在完整 image 构建上下文定义、IB 构建期
          #    不定义）→ 独立 `make target/linux/install` 崩在该目标。我们已在「Exclude openwrt_one」
          #    步把它从 filogic TARGET_DEVICES 剔除（开发板、不发货），绕开该坑且不影响真要发货的
          #    设备（jcg_q30-pro 等）的 kernel.bin 预置。
          # ⚠️⚠️ 2026-10-24：用 { … } 2>&1 | tee /tmp/build.log 把完整 make 输出落盘。
          #    GH 默认 shell 已带 -o pipefail，make 真实退出码仍能触发本步失败；
          #    同时 /tmp/build.log 供失败时的 Dump 步抓取——否则 ci-logs 一旦失明，
          #    我们连 make 报什么错都看不到（这正是 run2 失明的原因）。
          # ⚠️ 2026-10-31 起加 -k（keep-going）：并行构建下首个 kmod 失败就会 abort，
          #    看不出还有哪些 kmod 也编不过。-k 让 make 跳过失败目标继续编其余，最终
          #    仍因任一目标失败返回非零（CI 门禁不失效），但 /tmp/build.log 会集齐所有
          #    失败包，便于一次性定位、批量修复（避免 2~4h 一轮的打地鼠）。
          { make -k -j$(nproc) tools/install toolchain/install target/compile \
                          package/compile package/install target/linux/install \
                          target/imagebuilder/compile V=s
          } 2>&1 | tee /tmp/build.log
          ls -lh bin/targets/*/*/*imagebuilder*.tar.zst
          echo "--- bin/packages 是否含 kmod（抽查）---"
          find bin/packages -name 'kmod-*.ipk' | head -3 || true
          # ⚠️ 2026-10-25 修正：后缀不再是 -kernel.bin 一种（详见 Inspect 步门禁注释）。
          #   qualcommax 全走 Device/FitImage → 产物是 <device>-uImage.itb，
          #   按 -kernel.bin 统计会显示 0 并误导排查（ipq60xx 31 个设备全是 itb）。
          echo "--- 逐机型内核镜像数量（后缀随 KERNEL_SUFFIX 变：*-kernel.bin 或 *-uImage.itb...；仅观测）---"
          find build_dir/target-*/linux-[!f]* -maxdepth 1 \
               \( -name '*-kernel.bin' -o -name '*-kernel.itb' -o -name '*-uImage' \
                  -o -name '*-uImage.itb' -o -name '*-zImage' -o -name '*-zImage.itb' \) 2>/dev/null | wc -l
          find build_dir/target-*/linux-[!f]* -maxdepth 1 \
               \( -name '*-kernel.bin' -o -name '*-kernel.itb' -o -name '*-uImage' \
                  -o -name '*-uImage.itb' -o -name '*-zImage' -o -name '*-zImage.itb' \) 2>/dev/null | head -5

      # ⚠️ kmod 覆盖自检（对应「自编 IB + 外挂 owai 远程源」架构的必需前提）
      #   owai 远程源实测为纯 userspace（kmod-* = 0），但有 128 个包的 Depends 引用
      #   kmod-*。这些 kmod 必须由 IB 本地提供，否则 assembler 装包时报
      #   "Unknown package" → §4 静默剔除 → 插件不进固件。
      #   本步在发布前核对：owai 依赖的 kmod ∩ IB 本地 packages/ 的缺失集。
      #   缺失 = 真问题（该插件装不上），必须 fail 拦下，别等用户刷完才发现。
      - name: Self-check IB (kmod coverage vs owai remote)
        working-directory: openwrt
        run: |
          IB=$(ls bin/targets/*/*/*imagebuilder*.tar.zst | head -1)
          echo "IB=$IB"
          rm -rf /tmp/ibkmod && mkdir -p /tmp/ibkmod
          tar -I zstd -xf "$IB" -C /tmp/ibkmod
          D=$(find /tmp/ibkmod -maxdepth 1 -type d -name '*imagebuilder*' | head -1)
          echo "IB dir=$D"

          # IB 本地已编的 kmod 名集合（去掉 _版本 后缀；统一 LC_ALL=C 保证排序一致）
          find "$D/packages" -name 'kmod-*.ipk' -printf '%f\n' 2>/dev/null \
            | sed -E 's/_[0-9].*//' | LC_ALL=C sort -u > /tmp/ib_kmods.txt
          echo "IB 本地 kmod 数 = $(wc -l < /tmp/ib_kmods.txt)"

          # 抓 owai kiddin9 索引，提取所有 kmod-* 依赖。
          # ⚠️⚠️ 2026-10-21 实锤的假通过 bug（run 39454332271 自检报 0/0 全覆盖，实为缺失 4 个）：
          #   原写法从 ipk 文件名猜 arch（awk -F'_' $(NF-1) / 尾两段），而
          #   kmod-3c59x_6.12.108-r1_aarch64_cortex-a53.ipk 的 arch 是两段
          #   （aarch64_cortex-a53）且前面还有 version 段，两种猜法都取错
          #   → URL 404 → dl.openwrt.ai 对坏路径返回 HTTP 200 的 HTML 错误页
          #   → curl -f 不拦 → zcat 静默失败（2>/dev/null 吞错）→ 0/0 假全覆盖。
          #   正解：IB 的 staging_dir/target-<arch>_musl 目录名是权威 arch 来源
          #   （实测 staging_dir/target-aarch64_cortex-a53_musl → aarch64_cortex-a53）。
          #   另加双保险：curl 后强制 gzip 魔术头校验 + owai kmod 数下限断言（历史 94~95）。
          #   ③ kmod 名正则允许下划线（kmod-sprd_pcie 曾因正则不含 _ 被截成 kmod-sprd 造成假缺失）。
          ARCH=$(ls -d "$D"/staging_dir/target-*_musl 2>/dev/null | head -1 \
                  | sed 's|.*/target-||; s|_musl$||')
          echo "arch = $ARCH"
          if [ -z "$ARCH" ]; then
            echo "::error::无法从 staging_dir 推导 arch，kmod 覆盖自检无法进行"
            exit 1
          fi
          # 抽 owai【冻结 25.12】四 feed（kiddin9/packages/base/luci）全部 kmod-* 依赖，
          # 对 aarch64_cortex-a53 / aarch64_generic 取并集（kmod 包名与 arch 无关），
          # 与 Generate .config 的数据驱动注入【同源同口径】——此处作发布前校验门禁。
          # 不再只扫 kiddin9：packages/base/luci 也有 kmod 依赖（usb/storage 等），
          # 单扫会误报缺失（实为注入已覆盖）。
          : > /tmp/owai_kmods.txt
          for _ax in aarch64_cortex-a53 aarch64_generic; do
            for _fd in kiddin9 packages base luci; do
              _gz="/tmp/owai_chk_${_ax}_${_fd}.gz"
              curl -sSL -m 120 -o "$_gz" \
                "${VERSION_REPO}/packages/${_ax}/${_fd}/Packages.gz" 2>/dev/null || continue
              _mg=$(head -c2 "$_gz" | od -An -tx1 | tr -d ' \n')
              [ "$_mg" = "1f8b" ] || continue
              zcat "$_gz" 2>/dev/null | grep -E '^Depends:' \
                | grep -oE 'kmod-[a-z0-9][a-z0-9_-]*' >> /tmp/owai_kmods.txt
            done
          done
          LC_ALL=C sort -u /tmp/owai_kmods.txt -o /tmp/owai_kmods.txt
          OWAI_N=$(wc -l < /tmp/owai_kmods.txt)
          echo "owai 依赖的 kmod 种数（四 feed 并集）= $OWAI_N"
          if [ "$OWAI_N" -lt 50 ]; then
            echo "::error::owai kmod 依赖只提取到 $OWAI_N 种（四 feed 并集应 >100）——索引解析异常，拒绝发布"
            exit 1
          fi

          # 差集 = 缺失。
          # ⚠️ 必须用 grep -Fxf 求交集再 comm，**不能直接 comm -23 owai ib**：
          #   实测 comm 在两边排序规则/locale 不一致时会把已存在的条目误报为缺失
          #   （本次实测：直接 comm 报 94 个缺失，实际只缺 6 个，88 个是假象）。
          #   正确做法：先 grep -Fxf 求交集（逐行精确匹配，不受排序影响），再求差。
          grep -Fxf /tmp/owai_kmods.txt /tmp/ib_kmods.txt | LC_ALL=C sort -u > /tmp/both_kmods.txt
          LC_ALL=C sort -u /tmp/owai_kmods.txt > /tmp/o_sorted.txt
          LC_ALL=C sort -u /tmp/ib_kmods.txt  > /tmp/i_sorted.txt
          comm -23 /tmp/o_sorted.txt /tmp/both_kmods.txt > /tmp/missing_kmods.txt || true
          MISS=$(wc -l < /tmp/missing_kmods.txt)
          echo "--- 缺失 kmod（owai 需要但 IB 没有），交集 $(wc -l < /tmp/both_kmods.txt) / owai $(wc -l < /tmp/o_sorted.txt) ---"
          if [ "$MISS" -eq 0 ]; then
            echo "无 ✓ kmod 全覆盖"
          else
            cat /tmp/missing_kmods.txt
            echo "缺失合计 = $MISS"
            # 只 warning 不 fail：这些 kmod 可能该 target 本就不支持（如 kmod-xdpi 需新内核），
            # 由 assembler 的 §4 剔除即可；但必须显式点名，避免静默丢失插件。
            echo "::warning::owai 依赖 $MISS 个 kmod 在 IB 本地缺失，依赖它们的插件将被 assembler 剔除（见上）"
          fi

      # ⚠️ 生成代差自检：抽出 IB 跑 make info（与 assembler「镜像定义修复」后那步同构）。
      #    若 IB 内核代与 makefile 脱代（如上游漂到 6.12.109+ 而源树仍 6.12.108），
      #    这里会报 "Missing kernel version/hash file for 6.12" 并非零退出 → 直接 fail，
      #    拦在 Upload/Release 之前，避免发布一个 assembler 会致命崩溃的 IB。
      - name: Self-check IB (make info must not crash)
        working-directory: openwrt
        run: |
          IB=$(ls bin/targets/*/*/*imagebuilder*.tar.zst | head -1)
          echo "IB=$IB"
          rm -rf /tmp/ibcheck && mkdir -p /tmp/ibcheck
          tar -I zstd -xf "$IB" -C /tmp/ibcheck
          D=$(find /tmp/ibcheck -maxdepth 1 -type d -name '*imagebuilder*' | head -1)
          echo "IB dir=$D"
          cd "$D"
          echo "--- make info (assembler 同构步骤，期望零退出) ---"
          make info && echo "make info OK (IB 自洽，可安全发布)" || {
            echo "::error::make info 非零退出 —— IB 与源树内核代脱代，assembler 会致命崩溃，已拦截发布"
            exit 1
          }

      # ⚠️ 先把产物打包+上传，保证即使后续 Verify/Inspect 失败也能拿到 IB
      - name: Package artifacts
        working-directory: openwrt
        run: |
          mkdir -p ../out
          cp bin/targets/*/*/*imagebuilder*.tar.zst ../out/
          cd ../out && sha256sum *imagebuilder*.tar.zst > sha256sums
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: owai-ib-${{ env.TARGET_SAFE }}-${{ github.run_id }}
          path: out/
          retention-days: 14

      - name: Verify IB (kmods required when STANDALONE)
        working-directory: openwrt
        run: |
          IB=$(ls bin/targets/*/*/*imagebuilder*.tar.zst | head -1)
          echo "IB=$IB"
          echo "--- tar 内 packages/ 抽样（前 5 条）---"
          tar -tf "$IB" | grep 'packages/' | head -5 || true
          # ⚠️ STANDALONE 分支的 $(CP) -t packages/ 是【平铺】拷贝（无 feed 子目录），
          #    路径形如 <IB>/packages/kmod-xxx.ipk；模式必须同时兼容平铺与嵌套。
          #    `|| true` 防 bash -e：grep -c 数出 0 时 exit 1 会直接杀掉脚本。
          KC=$(tar -tf "$IB" | grep -cE 'packages/([^/]*/)?kmod-[^/]*\.ipk$' || true)
          echo "kmod 数量 = $KC  (STANDALONE=$STANDALONE)"
          if [ "$STANDALONE" = "true" ] && [ "$KC" -eq 0 ]; then
            echo "::error::STANDALONE IB 内未包含任何 kmod！请检查 .config 是否真的生效了 CONFIG_IB=y + CONFIG_IB_STANDALONE=y。"
            exit 1
          fi
          if [ "$STANDALONE" = "false" ]; then
            echo "注意：STANDALONE=false，IB 不含本地 kmod（依赖远程，而 owai 无远程 kmod → 此 IB 对 owai 不可用）"
          fi
          echo "kmod 校验完成 ✓"

      - name: Inspect produced IB (verify layout)
        working-directory: openwrt
        run: |
          IB=$(ls bin/targets/*/*/*imagebuilder*.tar.zst | head -1)
          echo "IB=$IB"
          mkdir -p /tmp/ib
          tar -I zstd -xf "$IB" -C /tmp/ib --wildcards '*/repositories.conf' '*/repositories' 2>/dev/null || true
          D=$(find /tmp/ib -maxdepth 1 -type d -name '*imagebuilder*' | head -1)
          echo "--- $D/repositories.conf ---"
          cat "$D/repositories.conf" 2>/dev/null || echo "(无 repositories.conf)"
          echo ""
          echo "--- IB 内 packages/ 统计 ---"
          LIST=$(tar -tf "$IB" | grep -E 'packages/([^/]*/)?[^/]*\.ipk$')
          TOT=$(echo "$LIST" | grep -cE '.' || true)
          KMOD=$(echo "$LIST" | grep -cE 'kmod-[^/]*\.ipk$' || true)
          echo "总 ipk 数 = $TOT"
          echo "kmod 数   = $KMOD"
          PKGMGR=$( [ -f "$D/repositories.conf" ] && echo opkg || echo apk )
          echo "包管理    = $PKGMGR"
          echo ""
          # ⚠️⚠️ 构建完整性快检（先于逐包断言，2026-11-02 新增）：
          #   若总 ipk 异常低（正常完整 IB 数千包）或 base-files/kernel 缺失，说明 Build 步骤
          #   有包/kernel 在 6.18 编译失败（make -k 带错继续 → 只产出残缺 IB），**不是 IB 配置
          #   缺包**。此时若直接走下方逐包断言，会列出一堆"缺失"误导排查（如 rockchip 仅 79 包
          #   报"缺 base-files/kernel/netifd…"）。故先给出明确结论 + 定位，直接 fail。
          #   定位：失败 job → 展开 'Dump diagnostics' 步（或 job 的 Summary tab）→ 查
          #   '① 全部 make 失败目标行' / '② 首个失败目标上下文'，即首个 make[?]: *** [...] Error 1。
          if [ "$TOT" -lt 200 ] || ! echo "$LIST" | grep -qE '(^|/)(base-files|kernel)[0-9]*_[^/]*\.ipk$'; then
            echo "::error::IB 构建不完整（总 ipk=$TOT，远低于正常 IB 的数千；base-files/kernel 缺失=内核或核心包在 6.18 编译失败，被 make -k 带错继续后产出残缺 IB）。这是 Build 步骤的编译失败，不是 IB 配置缺包。"
            echo "::error::定位编译失败：失败 job → 展开 'Dump diagnostics to ci-logs branch (on failure)' 步（或点 job 的 Summary tab）→ 查 '① 全部 make 失败目标行' / '② 首个失败目标上下文' = 首个 make[?]: *** [...] Error 1。"
            exit 1
          fi
          # ⚠️⚠️ 核心用户态链硬门禁（2026-10-22 实锤后新增）：
          #   此前本步只「数 ipk 个数」，于是 run 39593223394 四平台全绿、Release 正常发布，
          #   而产出的 IB 实际缺 11 项核心包（base-files/kernel/dnsmasq-full/firewall4/
          #   iptables-zz-legacy/luci-base/luci-compat/luci-lib-nixio/dropbear/
          #   rpcd-mod-luci/libustream-mbedtls）—— kmod 1113 个倒是齐全。
          #   下游 firmware-assembler 的 17 项校验拦住了切换（闸门生效，没造成事故），
          #   但 CI 不该把残缺 IB 发成 Release。这里在**发布前**逐包断言，缺一个就 fail。
          #   名单与 assembler 的 verify_ib 逐字对齐。
          echo "--- 核心用户态链断言（17 项，缺一即 fail）---"
          MISS=""
          for p in base-files libc kernel uci netifd dnsmasq-full firewall4 \
                   nftables-json luci-base luci-compat luci-lib-nixio \
                   ppp-mod-pppoe dropbear odhcp6c rpcd-mod-luci libustream-mbedtls; do
            # ⚠️ 匹配必须容忍 ABI 版本后缀（run 39755751903 实锤误报）：
            #   libustream 的 mbedtls 变体真实包名是 libustream-mbedtls20201210
            #   （PKG_ABI_VERSION 拼在名字后），不是 libustream-mbedtls。
            #   若用 "^libustream-mbedtls_" 会漏匹配 → 门禁误报缺包 → 拒绝发布。
            #   故允许 name 后紧跟一串数字（ABI）再跟 _。
            if echo "$LIST" | grep -qE "(^|/)${p}[0-9]*_[^/]*\.ipk$"; then
              echo "  ✓ $p"
            else
              echo "  ✗ $p 不在 IB 里"; MISS="$MISS $p"
            fi
          done
          if [ -n "$MISS" ]; then
            echo "::error::IB 缺核心用户态链:$MISS —— 组装必报 opkg Unknown package，拒绝发布"
            exit 1
          fi
          echo "核心用户态链 17 项全部在 IB 内 ✓"
          echo ""
          # ⚠️⚠️ 逐机型「内核镜像」硬门禁（2026-10-24 由"仅观测"改为硬门禁；
          #    2026-10-25 二次修正：**后缀不能写死 -kernel.bin**）。
          #
          #   【为什么必须有】下游 make image 运行期 IB=1 时，image.mk 的
          #   $(KDIR_KERNEL_IMAGE) 规则被 `ifndef IB`（image.mk:753）整段屏蔽，根本
          #   没有现编内核的规则，只能依赖 IB 预置的逐机型内核镜像。预置来自构建期：
          #   image.mk:755（ifndef IB+ifdef CONFIG_IB → `install: <dev><SUFFIX>`）
          #   + 本流程已含的 target/linux/install 实跑 + imagebuilder/Makefile:112
          #   （`-cp $(KERNEL_BUILD_DIR)/* $(IB_KDIR)/`）。run4 漏掉 target/linux/install
          #   → 0 个 → 下游 .itb 设备组装必崩。故本门禁必须硬性。
          #
          #   【⚠️ 为什么后缀不能写死】（2026-10-25 ipq60xx 连续失败的真凶）
          #   image.mk:506 默认 `KERNEL_SUFFIX := -kernel.bin`，但 **每个设备可覆写**，
          #   :625 `KDIR_KERNEL_IMAGE := $(KDIR)/$(1)$$(KERNEL_SUFFIX)` —— 产物后缀随之变。
          #   qualcommax 的 Device/FitImage / Device/FitImageLzma 覆写成 **-uImage.itb**
          #   （target/linux/qualcommax/image/Makefile:15/21）。而 ipq60xx 的 31 个设备
          #   **全部**走这条路径 → IB 里一个 -kernel.bin 都没有 → 写死的门禁必杀它。
          #   ipq807x 只因 asus_rt-ax89x 不走 FitImage、留下 1 个 -kernel.bin 才侥幸通过。
          #   本地全树统计实锤：
          #     mediatek/filogic 209 个设备 → 209 个 -kernel.bin
          #     rockchip/armv8    62 个设备 →  62 个 -kernel.bin
          #     qualcommax/ipq807x 46 个设备 →  1 个 -kernel.bin + 45 个 -uImage.itb
          #     qualcommax/ipq60xx 31 个设备 →  0 个 -kernel.bin + 31 个 -uImage.itb  ← 被误杀
          #   全树后缀实测 11 种（-kernel.bin/-kernel.itb/-uImage/-uImage.itb/
          #   -fit-uImage.itb/-zImage/-zImage.itb/-fit-zImage.itb(含 .vboot)/-factory.firm/.ari），
          #   故这里按**内核镜像后缀并集**接受（排除厂商固件格式 .ari / -factory.firm）。
          echo "--- 逐机型内核镜像计数（硬门禁：必须 > 0）---"
          KBSUF='kernel\.bin|kernel\.itb|uImage|uImage\.itb|fit-uImage\.itb|zImage|zImage\.itb|fit-zImage\.itb'
          KB=$(tar -tf "$IB" | grep -cE "build_dir/.*/linux-[^/]+/[^/]+(-($KBSUF))(\.vboot)?$" || true)
          echo "内核镜像总数 = $KB"
          echo "按后缀分布："
          tar -tf "$IB" | grep -E "build_dir/.*/linux-[^/]+/[^/]+(-($KBSUF))(\.vboot)?$" \
            | sed -E 's#.*/[^/]*-[^/]*(-(kernel|uImage|zImage)[^/]*)$#\1#' | sort | uniq -c | sort -rn | head -10
          tar -tf "$IB" | grep -E "build_dir/.*/linux-[^/]+/[^/]+(-($KBSUF))(\.vboot)?$" | head -3
          if [ "$KB" -eq 0 ]; then
            echo "::error::IB 内 0 个逐机型内核镜像 —— 构建期漏跑 target/linux/install 或 openwrt_one 坑未绕开，下游组装必崩，拒绝发布"
            exit 1
          fi
          echo "逐机型内核镜像校验通过 ✓（IB 已预置，下游 make image 可直接复用）"
          echo ""
          # ⚠️⚠️ U-Boot FIP / TFA bl2 硬门禁（2026-10-24 新增，build (6).log 实锤）：
          #   IB 运行期 Build/mt7981-bl31-uboot 会 `cat $(STAGING_DIR_IMAGE)/mt7981_<dev>-u-boot.fip`
          #   拼 bl31-uboot.fip；Build/mt7981-bl2 拼 preloader.bin 要 <tfa-variant>-bl2.img。
          #   这两类件只由 uboot-mediatek / arm-trusted-firmware-mediatek 的 filogic 设备变体
          #   编出（HIDDEN+DEFAULT 仅随设备 profile 选中，故 Generate .config 步已显式 =y）。
          #   若漏选 → STAGING_DIR_IMAGE 无件 → imagebuilder/Makefile:136 拷贝后 IB 仍缺 →
          #   下游 jcg_q30-pro 组装 `cat .../mt7981_jcg_q30-pro-u-boot.fip` No such file → Error 1。
          #   （FIP 由 uboot-mediatek Build/InstallDev:1515 命名 $(BUILD_VARIANT)-u-boot.fip；
          #    bl2 由 TFA Package/install:819 命名 $(BUILD_VARIANT)-bl2.img。）
          echo "--- U-Boot FIP / TFA bl2 断言（硬门禁，仅 filogic）---"
          FIP=$(tar -tf "$IB" | grep -cE 'staging_dir/target-[^/]+/image/[^/]+-u-boot\.fip$' || true)
          BL2=$(tar -tf "$IB" | grep -cE 'staging_dir/target-[^/]+/image/[^/]+-bl2\.img$' || true)
          echo "u-boot.fip 数 = $FIP"
          echo "bl2.img 数    = $BL2"
          tar -tf "$IB" | grep -E 'staging_dir/target-[^/]+/image/mt7981_jcg_q30-pro-u-boot\.fip$' || true
          tar -tf "$IB" | grep -E 'staging_dir/target-[^/]+/image/mt7981-spim-nand-ddr3-bl2\.img$' || true
          # ⚠️ 仅 filogic 硬门禁：ipq807x/ipq60xx/armv8 不产 mt798x u-boot.fip/bl2（FIP/BL2 恒 0），
          #   非 filogic 平台若跑这些门禁会被误杀。故 4 条门禁全部加 filogic-only 守卫。
          if [ "$TARGET" = "mediatek/filogic" ] && [ "$FIP" -eq 0 ]; then
            echo "::error::IB 内 0 个 *-u-boot.fip —— filogic bootloader 变体未编出，下游所有 mt798x 设备组装必崩，拒绝发布"
            exit 1
          fi
          if [ "$TARGET" = "mediatek/filogic" ] && [ "$BL2" -eq 0 ]; then
            echo "::error::IB 内 0 个 *-bl2.img —— TFA bl2 未编出，下游所有 mt798x 设备 preloader 必缺，拒绝发布"
            exit 1
          fi
          if [ "$TARGET" = "mediatek/filogic" ] && ! tar -tf "$IB" | grep -qE 'staging_dir/target-[^/]+/image/mt7981_jcg_q30-pro-u-boot\.fip$'; then
            echo "::error::IB 缺 mt7981_jcg_q30-pro-u-boot.fip —— jcg_q30-pro 组装必崩，拒绝发布"
            exit 1
          fi
          if [ "$TARGET" = "mediatek/filogic" ] && ! tar -tf "$IB" | grep -qE 'staging_dir/target-[^/]+/image/mt7981-spim-nand-ddr3-bl2\.img$'; then
            echo "::error::IB 缺 mt7981-spim-nand-ddr3-bl2.img —— jcg_q30-pro preloader 源缺失，组装必崩，拒绝发布"
            exit 1
          fi
          if [ "$TARGET" = "mediatek/filogic" ]; then
            echo "U-Boot FIP / TFA bl2 校验通过 ✓（IB 已预置 filogic 全设备 bootloader）"
          else
            echo "非 filogic target($TARGET)：跳过 FIP/bl2 门禁（不产 mt798x bootloader）"
          fi
          echo ""
          # ⚠️⚠️ owai 依赖、但 owai 四流实测 0 命中的 core 包（必须 IB 本地出，
          #   详见 Generate .config 里的注释）。缺它们 firewall4 / passwall2 等装不上。
          echo "--- core 仓库包断言（owai 没有，只能 IB 出）---"
          MISS2=""
          # ⚠️ ABI 后缀有两种拼法（2026-10-23）：名字不以数字结尾时直接拼（libip4tc→libip4tc2、
          #   libxtables→libxtables12），以数字结尾时 OpenWrt 会插一个连字符
          #   （libiptext6 的 ABI_VERSION:=0 → 真实包名 **libiptext6-0**，owai 索引里
          #    firewall(v3) 的 Depends 就是这么写的）。故后缀要写成 (-?[0-9]*)? 。
          for p in curl libxtables libip4tc libip6tc libiptext libiptext6; do
            if echo "$LIST" | grep -qE "(^|/)${p}(-?[0-9]*)?_[^/]*\.ipk$"; then
              echo "  ✓ $p"
            else
              echo "  ✗ $p 不在 IB 里"; MISS2="$MISS2 $p"
            fi
          done
          # iptables / ip6tables 是 Provides 虚名，任一变体在即可（nft 或 zz-legacy）
          for grp in "iptables-nft|iptables-zz-legacy" "ip6tables-nft|ip6tables-zz-legacy"; do
            if echo "$LIST" | grep -qE "(^|/)(${grp})[0-9]*_[^/]*\.ipk$"; then
              echo "  ✓ $grp（任一变体在）"
            else
              echo "  ✗ $grp 都不在 IB 里"; MISS2="$MISS2 [$grp]"
            fi
          done
          if [ -n "$MISS2" ]; then
            echo "::error::IB 缺 owai 依赖的 core 包:$MISS2 —— firewall4/passwall2 等会装不上，拒绝发布"
            exit 1
          fi
          echo "core 仓库包全部在 IB 内 ✓"
          echo ""
          # STANDALONE=true 时 OpenWrt 故意只写本地源（packages 全捆绑），不含远程 owai 源；
          # 远程 owai 由下游 firmware-assembler 通过 OWAI_BASE_URL 注入。故 200 校验仅在非 standalone 时做。
          if [ "$STANDALONE" = "false" ]; then
            echo "--- 校验 repositories.conf 的每个远程源是否 200 ---"
            python3 - "$D/repositories.conf" <<'PY'
          import sys, urllib.request
          f = sys.argv[1]
          try:
              lines = open(f).read().splitlines()
          except Exception as e:
              print("无法读取", f, e); sys.exit(0)
          urls = [l.split()[2] for l in lines if l.startswith("src/gz") and len(l.split())>=3]
          for u in urls:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u+"/Packages.gz", method="HEAD"), timeout=20)
                  print("  %s %s" % (r.status, u))
              except Exception as e:
                  print("  %s %s" % (getattr(e,'code',type(e).__name__), u))
          PY
          else
            echo "STANDALONE=true：repositories.conf 仅含本地源（packages 已全捆绑），远程 owai 由下游 assembler 注入，跳过 200 校验。"
          fi
          {
            echo "## IB 产物"
            echo ""
            echo "- 文件: \`$(basename "$IB")\`  ($(du -h "$IB" | cut -f1))"
            echo "- 包管理: $PKGMGR"
            echo "- STANDALONE: $STANDALONE（true=packages 全本地捆绑，repositories.conf 仅本地源；owai 远程由下游 assembler 注入）"
            echo "- 总 ipk 数: $TOT   kmod 数: $KMOD"
            echo '```'
            cat "$D/repositories.conf" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ 本机没有 GitHub token，读不到 Actions 的 job 日志（私有仓）。失败时把关键现场
      #    推到 **ci-logs 分支**的 logs/<run_id>-<target>.txt（每平台一个文件，文件名唯一互不
      #    冲突），我这边用 git + SSH（git fetch origin ci-logs）就能取回逐个排查。
      #    ⚠️ 绝不能推回 ci-filogic（那会又触发一次 workflow → 死循环）。
      #    ci-logs 是长期诊断分支，整轮修完保留即可（旧诊断可追溯历史）。
      #    ⚠️ 2026-10-26 修正：此前推 ci-logs-runs/* 独立 ref 在 runner 侧静默失败→本机失明；
      #       改回推既有 ci-logs 分支（已实证可读），文件名带 run_id+target 唯一不冲突，
      #       并发同推由 pull --rebase + 重试兜底。
      - name: Dump diagnostics to ci-logs branch (on failure)
        # ⚠️ 2026-10-25 补 `|| cancelled()`：job 被取消（6h runner 硬上限 / 手工 cancel /
        #    concurrency cancel-in-progress 抢跑）时状态是 **cancelled 而非 failure**，
        #    只写 failure() 会让这些情况全部失明——run12「8h 无 tag 且 ci-logs 不动」
        #    正是撞在这上面。加上 cancelled 后，无论超时还是被抢跑都能带回现场。
        # ⚠️⚠️ 2026-10-25 二次修（run14 失明根因）：**绝不能用 working-directory: openwrt**！
        #    若 Clone 步失败导致 openwrt 目录不存在，GitHub 会让本 step 因「目录不存在」
        #    直接失败，再被 continue-on-error 静默吞掉 → 诊断命令压根不执行 → 本机失明。
        #    改为脚本内 `cd openwrt`（容错），即使目录不存在也能把诊断采集与推送跑完。
        #    ⚠️ 推送目标改为 **每平台独立 ref**（见下方），并发竞争从根上消除；仍保留 3 次重试
        #       兜底瞬时网络失败，确保诊断必落盘、本机 git ls-remote 必见。
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          {
            cd openwrt 2>/dev/null || cd .
            echo "run=${{ github.run_id }} attempt=${{ github.run_attempt }} target=$TARGET"
            echo "job_status=${{ job.status }}"
            echo "--- 若下面 make 日志末行是正常编译中、且无报错 → 说明 job 是【被取消/超时】，"
            echo "    而非编译失败。常见三因：① 超 timeout-minutes(330m) ② 6h runner 硬上限"
            echo "    ③ concurrency cancel-in-progress（同一分支新推送抢跑）"
            echo "    ④ GitHub Free 私有仓月度配额(2000min)耗尽 → job 排队未启动（日志会是空的）"
            echo "--- .config 关键项 ---"
            grep -E '^(CONFIG_TARGET_ROOTFS|CONFIG_IB|CONFIG_IB_STANDALONE|CONFIG_ALL_KMODS)' .config 2>/dev/null
            grep -E '^CONFIG_PACKAGE_(curl|iptables-nft|iptables-zz-legacy|ip6tables-nft|ip6tables-zz-legacy|libxtables|libip4tc|libip6tc|libiptext6|libiptext|xtables-legacy|xtables-nft)=' .config 2>/dev/null
            echo "--- 内核镜像数（后缀随 KERNEL_SUFFIX 变；预期 > 0；target/linux/install 产出）---"
            find build_dir/target-*/linux-[!f]* -maxdepth 1 \
                 \( -name '*-kernel.bin' -o -name '*-kernel.itb' -o -name '*-uImage' \
                    -o -name '*-uImage.itb' -o -name '*-zImage' -o -name '*-zImage.itb' \) 2>/dev/null | wc -l
            find build_dir/target-*/linux-[!f]* -maxdepth 1 \
                 \( -name '*-kernel.bin' -o -name '*-kernel.itb' -o -name '*-uImage' \
                    -o -name '*-uImage.itb' -o -name '*-zImage' -o -name '*-zImage.itb' \) 2>/dev/null | head -5
            echo "--- KDIR(linux-* 非 firmware) 顶层内容前 20 ---"
            # ⚠️ 2026-10-24 修正：原 `linux-*/` 会把 linux-firmware-20260221 也算进来，
            #   掩盖真正的内核构建目录。用 linux-[!f]* 排除 firmware 目录。
            ls build_dir/target-*/linux-[!f]*/ 2>/dev/null | head -20
            echo "--- bin/packages 关键包（core 仓库那批）---"
            find bin/packages -name '*.ipk' -printf '%f\n' 2>/dev/null \
              | grep -E '^(curl|iptables-nft|iptables-zz-legacy|ip6tables-nft|ip6tables-zz-legacy|libxtables12|libip4tc2|libip6tc2|libiptext0|libiptext6-0)' \
              | head -20
            echo "--- filogic bootloader config 符号（mt7981 =y 行数 + jcg 样本）---"
            grep -cE '^CONFIG_PACKAGE_(u-boot|trusted-firmware-a)-mt7981' .config 2>/dev/null
            grep -E '^CONFIG_PACKAGE_u-boot-mt7981_jcg_q30-pro=|^CONFIG_PACKAGE_trusted-firmware-a-mt7981-spim-nand-ddr3=' .config 2>/dev/null || echo "(!! jcg uboot/tfa =y 缺失 → bootloader 前缀/过滤又错了)"
            echo "--- IB 内 FIP/bl2 清单 + jcg 精确判定（诊断 FIP 门禁的根因现场）---"
            IBDUMP=$(ls bin/targets/*/*/*imagebuilder*.tar.zst 2>/dev/null | head -1)
            if [ -n "$IBDUMP" ]; then
              echo "IB=$IBDUMP"
              # 2026-10-25 加：内核镜像门禁失败时的直接现场（后缀随 KERNEL_SUFFIX 变，
              # 只查 -kernel.bin 会在 qualcommax 上永远显示 0 而掩盖真相）
              echo "IB 内内核镜像总数 = $(tar -tf "$IBDUMP" | grep -cE 'build_dir/.*/linux-[^/]+/[^/]+(-(kernel\.bin|kernel\.itb|uImage|uImage\.itb|fit-uImage\.itb|zImage|zImage\.itb|fit-zImage\.itb))(\.vboot)?$' || true)"
              echo "FIP 总数 = $(tar -tf "$IBDUMP" | grep -cE 'image/[^/]+-u-boot\.fip$' || true)"
              echo "bl2 总数 = $(tar -tf "$IBDUMP" | grep -cE 'image/[^/]+-bl2\.img$' || true)"
              echo "jcg FIP / bl2 精确判定:"
              tar -tf "$IBDUMP" | grep -E 'image/mt7981_jcg_q30-pro-u-boot\.fip$|image/mt7981-spim-nand-ddr3-bl2\.img$' || echo "(!! 缺 jcg FIP 或 bl2 → 即 FIP 门禁失败根因)"
            else
              echo "(未找到 IB tar.zst)"
            fi
            echo "--- Build 步 make 实际报错（2026-10-31 二次修：run55 尾部80行只有 perl 收尾+Error 2，"
            echo "    并行 make 下真凶在日志中部。改为：① 所有 make[?]*** 失败目标行 ② 首个失败目标"
            echo "    前后上下文 ③ 常见错误模式行 ④ 尾部100行）---"
            if [ -f /tmp/build.log ]; then
              echo "build.log 行数 = $(wc -l < /tmp/build.log)"
              echo "--- ① 全部 make 失败目标行（\\*\\*\\*）---"
              grep -nE 'make\[[0-9]+\]: \*\*\*' /tmp/build.log | head -300
              echo "--- ② 首个失败目标上下文（前 40 行 + 后 10 行）---"
              L=$(grep -nE 'make\[[0-9]+\]: \*\*\*' /tmp/build.log | head -1 | cut -d: -f1)
              if [ -n "$L" ]; then
                S=$(( L > 40 ? L - 40 : 1 )); E=$(( L + 10 ))
                sed -n "${S},${E}p" /tmp/build.log
              fi
              echo "--- ②b 真凶上下文（围绕 OpenWrt 汇总行 'ERROR: package/X failed to build' 的 80 行前 + 20 行后）---"
              # ⚠️ ② 抓的是【首个】make[?]: *** 行，往往是被 make 标 (ignored) 的噪音
              #    （如 libtool abort-due-to-no-makefile / uninstall Error 2 (ignored)）。
              #    真正致命的是 OpenWrt 的汇总行 'ERROR: package/X failed to build'，
              #    其【紧上方】就是该包的编译/下载真错。本段优先抓它，自解释失败原因。
              grep -nE 'ERROR: package/.* failed to build' /tmp/build.log > /tmp/fatals.txt 2>/dev/null || true
              if [ -s /tmp/fatals.txt ]; then
                while read -r eline; do
                  N=$(printf '%s' "$eline" | cut -d: -f1)
                  P=$(printf '%s' "$eline" | sed -E 's/.*ERROR: package\/([^ ]+) failed to build.*/\1/')
                  echo ">>> 致命包: $P (build.log:$N)"
                  S=$(( N > 80 ? N - 80 : 1 )); E=$(( N + 20 ))
                  sed -n "${S},${E}p" /tmp/build.log
                  echo "<<<"
                done < /tmp/fatals.txt
              else
                echo "(无 'ERROR: package/X failed to build' 行 → 失败非包编译类，见 ①/③/④)"
              fi
              echo "--- ②c download.pl 下载报错（URL / Download failed / Hash mismatch，区分下载 vs 编译）---"
              grep -nE 'Download failed|Downloading |\+ curl|No more mirrors|Hash of the downloaded|404|403' /tmp/build.log | tail -40 || true
              echo "--- ③ 常见错误模式行（error/ERROR/Error/undefined/No rule/missing/DTC）---"
              grep -nE '(^| )(ERROR|Error):|error:|undefined reference|No rule to make target|is missing dependencies|not found|dtc:|DTC|Reference to non-existent|duplicate (label|node)|syntax error' /tmp/build.log | head -400
              echo "--- ③b missing-dependencies 上下文（列出缺失的具体 .so）---"
              grep -n -A8 "missing dependencies for the following libraries:" /tmp/build.log | head -40
              echo "--- ④ DTC / 设备树编译错误（DTC 用 'Error:' 大写，易被漏抓）---"
              grep -nE "Error: |dtc: |DTC: |Reference to non-existent|invalid type|syntax error" /tmp/build.log | head -80
              echo "--- ④b S20 设备树确定性重编译（用内核自带 dtc 单独重编，绕开并行构建吞噬 DTC 真错）---"
              # ⚠️ OpenWrt 目标 dts 在 **源树** target/linux/mediatek/dts/，
              #    不在内核树 arch/arm64/boot/dts/mediatek（那只有内核自带 dts）。
              #    之前 DTCSRC 指向内核树 → 永远找不到 s20*.dts → 形同虚设。
              KDIR=$(ls -d build_dir/target-*/linux-mediatek_filogic/linux-6.18* 2>/dev/null | head -1)
              DTCDIR="$KDIR/scripts/dtc"
              DTCSRC="target/linux/mediatek/dts"
              DTCSRC_K=$(ls -d build_dir/target-*/linux-mediatek_filogic/linux-6.18*/arch/arm64/boot/dts 2>/dev/null | head -1)
              if [ -x "$DTCDIR/dtc" ] && [ -d "$DTCSRC" ]; then
                # ⚠️ 必须用 cpp 预处理 .dts 再 dtc：直接 dtc -I dts 会把 #include 当语法错误
                #   误报 "s20*.dts:4.1-9 syntax error"（run20/21 的假错根源）。OpenWrt 构建系统
                #   本身也是 cpp 预处理后再 dtc，此处复刻同样的预处理链路。
                CPP=$(ls staging_dir/host/bin/gcc 2>/dev/null || command -v gcc 2>/dev/null || true)
                for d in mt7986a-supergateway-s20l mt7986a-supergateway-s20m mt7986a-supergateway-s20p; do
                  echo "=== cpp+dtc 重编 $d ==="
                  if [ -n "$CPP" ]; then
                    "$CPP" -E -P -x assembler-with-cpp -I"$KDIR/include" -I"$DTCSRC" ${DTCSRC_K:+-I"$DTCSRC_K"} \
                      "$DTCSRC/$d.dts" -o /tmp/$d.pre.dts 2>/tmp/$d.cpp.err || { echo "(cpp 预处理失败，附错误:)"; head -20 /tmp/$d.cpp.err; }
                    "$DTCDIR/dtc" -I dts -O dtb -i "$DTCSRC" -i "$KDIR/include" ${DTCSRC_K:+-i "$DTCSRC_K"} \
                      /tmp/$d.pre.dts -o /tmp/$d.dtb 2>&1 | head -40 || true
                  else
                    echo "(无 cpp，直接 dtc 可能误报 #include，仅供参考)"
                    "$DTCDIR/dtc" -I dts -O dtb -i "$DTCSRC" -i "$KDIR/include" ${DTCSRC_K:+-i "$DTCSRC_K"} \
                      "$DTCSRC/$d.dts" -o /tmp/$d.dtb 2>&1 | head -40 || true
                  fi
                done
              else
                echo "(内核 dtc 或 OpenWrt dts 源目录不可用 → 回退 build.log 抓取 supergateway-s20)"
                grep -nE "supergateway-s20|Error: |dtc: |FATAL ERROR|Reference to non-existent|duplicate (label|node)|syntax error" /tmp/build.log | head -60 || true
              fi
              echo "--- ⑤ 末尾 100 行 ---"
              tail -100 /tmp/build.log
            else
              echo "(无 /tmp/build.log)"
            fi
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          # ⚠️ 双保险：诊断同时写进 job Summary（GitHub Actions 页面可见），
          #    即便下方 git push 失败（并发推分支偶发静默失败→本机失明），
          #    用户点进失败 job 的 Summary tab 也能直接看到全文，无需下载 artifact。
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          D=/tmp/cilog; rm -rf "$D"
          RUNREF="ci-logs-${{ github.run_id }}-${TARGET_SAFE}"
          # ⚠️ 推到【每 job 唯一分支】ci-logs-<run_id>-<target>：四平台并行零冲突，
          #   根治此前并发推同一 ci-logs 分支时非 filogic 平台被挤掉、本机失明的缺陷
          #   （ci-logs 历史只有 filogic 日志，ipq807x/ipq60xx/armv8 的失败转储从未落盘）。
          #   本机取回：git fetch origin 'ci-logs-*' 后逐分支读 logs/<run_id>-<target>.txt。
          if git clone --depth 1 -b "$RUNREF" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$D" 2>/dev/null; then
            echo "分支 $RUNREF 已存在，克隆成功"
          else
            mkdir -p "$D"; git -C "$D" init -q -b "$RUNREF"
            git -C "$D" remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            echo "分支 $RUNREF 不存在，本地新建（首次推送将创建远端分支）"
          fi
          mkdir -p "$D/logs"
          cp /tmp/diag.txt "$D/logs/${{ github.run_id }}-${TARGET_SAFE}.txt"
          # 同时落到 workspace 根，供下方 upload-artifact 兜底（git push 再失败时仍能从 Actions UI 取）
          cp /tmp/diag.txt "./diag-${TARGET_SAFE}-${{ github.run_id }}.txt"
          git -C "$D" -c user.email=ci@local -c user.name=ci add -A
          git -C "$D" -c user.email=ci@local -c user.name=ci commit -q -m "diag ${{ github.run_id }} ${TARGET_SAFE}" || echo "(ci-logs 无新内容可提交)"
          # 唯一分支 → 无并发冲突，直接 push 创建远端分支；保留 3 次重试兜网络瞬断。
          ok=0
          for attempt in 1 2 3; do
            if git -C "$D" push origin "HEAD:refs/heads/$RUNREF"; then ok=1; break; fi
            echo "push $RUNREF 尝试 $attempt 失败，重试..."; sleep 5
          done
          [ "$ok" = "1" ] && echo "✓ 诊断已推到分支 $RUNREF（本机 git fetch origin $RUNREF 可读 logs/${{ github.run_id }}-${TARGET_SAFE}.txt）" || echo "!! 推送失败（但 artifact 已留底，可去 Actions UI 取）"

      - name: Upload diagnostics artifact (on failure, fallback)
        # git push 失败时仍可从 Actions UI 下载诊断（非阻塞）。诊断同时落在
        #   ci-logs 分支（本机 git fetch origin ci-logs 可读 logs/<run_id>-<target>.txt）
        #   与 Action artifact。
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ env.TARGET_SAFE }}-${{ github.run_id }}
          path: diag-*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Create release
        # ⚠️ 本条件曾写 `inputs.make_release != false`——正是 env 注释里同款坑：
        #    push 触发时 inputs.* 全为 ''，而 GH 表达式里 `'' == false` 判定为 true
        #    → `'' != false` 为 false → 本步被静默 skip，Release 从未发布。
        #    正确姿势（与其他默认 true 布尔量一致）：未设置/显式 true → 发；仅显式 false → 不发。
        if: ${{ inputs.make_release == true || inputs.make_release == '' || inputs.make_release == null }}
        uses: softprops/action-gh-release@v2
        with:
          # 用 run_id（每次运行唯一）+ TARGET_SAFE 做 tag：
          #   - 三个并行 job 共享同一 run_id，必须带 target 区分，否则会抢同一个 tag；
          #   - TARGET_SAFE 已在首个 step 把 "/" 换成 "-"（Git tag 禁 "/"，且 replace() 不是合法 GH 函数）；
          #   - VERSION_NUMBER 必须用 env（push 触发时 inputs.version_number 为空，
          #     env 已回退 '25.12-owai'，否则 tag 会残缺成 ib--mediatek-...）。
          #   - target_commitish 显式指向本次运行的提交（github.sha），否则 action 会把 tag
          #     打到默认分支 HEAD（main），丢失 CI 代码溯源。
          #     ⚠️ 2026-10-26 晚实锤：此前写的键名 `commitish` 是 REST API 参数名，不是本 action
          #        的输入名（softprops/action-gh-release 只认 `target_commitish`），未知输入被
          #        静默忽略 → 历史上所有 tag 一直误指 main（661c2a4/07aec45d/eb9f4ef 全在 main
          #        历史上）。修正键名后 tag 才真正落到触发 commit。
          target_commitish: ${{ github.sha }}
          tag_name: ib-${{ env.VERSION_NUMBER }}-${{ env.TARGET_SAFE }}-${{ github.run_id }}
          name: OWAI-aligned ImageBuilder ${{ matrix.target }} ${{ env.VERSION_NUMBER }}
          files: |
            out/*.tar.zst
            out/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old IB tags & releases (keep newest 1 per platform)
        # 用户需求（2026-10-22）：更新时删掉旧 IB 包，避免 tag/asset 堆积占空间。
        # 现状实锤：曾堆积 9 个 IB tag（旧的 5 个甚至没有对应 Release——发布失败或被手删，
        # tag 残留），每个 asset ~87MB。清理逻辑两条都管：
        #   DELETE /releases/{id}     —— 连 asset 一起删（GitHub 会连带删 asset blob）
        #   DELETE /git/refs/tags/*  —— 没 Release 的残留 tag 也清掉
        # 并发安全：prefix 含平台名（ib-25.12-owai-<board>-<sub>-），四个并行 job 各清各的，
        # 互不重叠。时机在 Create release 之后，确保不会删掉本轮刚建的。
        if: ${{ always() && (inputs.make_release == true || inputs.make_release == '' || inputs.make_release == null) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_NEWEST: 1
          TAG_PREFIX: ib-${{ env.VERSION_NUMBER }}-${{ env.TARGET_SAFE }}-
          MY_TAG: ib-${{ env.VERSION_NUMBER }}-${{ env.TARGET_SAFE }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error

          API = "https://api.github.com/repos/wumengzhe/owai-ib-builder"
          TOK = os.environ["GH_TOKEN"]
          PREFIX = os.environ["TAG_PREFIX"]
          MY_TAG = os.environ["MY_TAG"]
          KEEP = int(os.environ.get("KEEP_NEWEST", "1"))

          def api(method, path):
              req = urllib.request.Request(API + path, method=method)
              req.add_header("Authorization", "Bearer " + TOK)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("User-Agent", "owai-ib-builder-prune")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, (json.load(r) if r.status != 204 else None)
              except urllib.error.HTTPError as e:
                  return e.code, None

          def runid(tag):
              m = re.search(r"-(\d+)$", tag)
              return int(m.group(1)) if m else 0

          # 1) 本平台旧 Release（排除本轮 tag；保留 run_id 最大的 KEEP 个）
          st, rels = api("GET", "/releases?per_page=100")
          if st != 200:
              print("[prune] 拉取 releases 失败 HTTP %s，跳过（本步非致命）" % st); sys.exit(0)
          mine = [r for r in rels if r["tag_name"].startswith(PREFIX)]
          mine.sort(key=lambda r: runid(r["tag_name"]), reverse=True)
          doomed = mine[KEEP:]
          # 2) 同平台残留 tag（有些 tag 根本没有 Release——发布失败或被手删）
          st, tags = api("GET", "/git/matching-refs/tags/" + PREFIX)
          if st == 200 and tags:
              live = {r["tag_name"] for r in mine[:KEEP]} | {MY_TAG}
              for r in tags:
                  n = r["ref"].split("/")[-1]
                  if n not in live and runid(n) and n not in [d["tag_name"] for d in doomed]:
                      doomed.append({"tag_name": n, "_ref": True})
          for d in doomed:
              if d.get("_ref"):
                  st, _ = api("DELETE", "/git/refs/tags/" + d["tag_name"])
                  print("[prune] 删残留 tag %s -> HTTP %s" % (d["tag_name"], st))
              else:
                  st, _ = api("DELETE", "/releases/%s" % d["id"])
                  print("[prune] 删旧 Release %s (assets %d 个) -> HTTP %s"
                        % (d["tag_name"], len(d.get("assets", [])), st))
                  st2, _ = api("DELETE", "/git/refs/tags/" + d["tag_name"])
                  print("        连带删 tag -> HTTP %s" % st2)
          print("[prune] 本平台共 %d 个历史 Release/tag，本次保留 %d、清理 %d"
                % (len(mine), min(KEEP, len(mine)), len(doomed)))
          PY
